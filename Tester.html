<!DOCTYPE html>
<html>
<head>
  <title>Create Drive Folder</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 500px;
    }
    h1 { color: #186E00; }
    input {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 14px;
    }
    button {
      background: #4285F4;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 10px;
      cursor: pointer;
      margin: 10px 0;
      width: 100%;
    }
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #f0f0f0;
      min-height: 80px;
      text-align: left;
      font-family: monospace;
      white-space: pre-wrap;
    }
    .success { color: #27ae60; font-weight: bold; }
    .error { color: #e74c3c; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📁 Create Drive Folder</h1>
    <p>Using your working Apps Script</p>
    
    <input type="text" id="scriptUrl" 
           placeholder="Paste your Apps Script URL here" 
           value="https://script.google.com/macros/s/AKfycbwADqDZgDjv0qEOv-V1Fbt4ssKkFccW4vx7EbMzn6aXi7BQ5qyFkMqUzI7Ab1W9XQ/exec">
    
    <button onclick="testConnection()">1. Test Connection</button>
    <button onclick="createFolder()">2. CREATE AttendanceASLS FOLDER</button>
    <button onclick="checkFolder()">3. Check if folder exists</button>
    
    <div class="status" id="status">
      Ready. Follow the steps above.
    </div>
  </div>

  <script>
    let scriptUrl = '';

    function testConnection() {
      scriptUrl = document.getElementById('scriptUrl').value.trim();
      const status = document.getElementById('status');
      
      if (!scriptUrl) {
        status.innerHTML = '<span class="error">❌ Please enter URL</span>';
        return;
      }
      
      status.innerHTML = '⏳ Testing connection...';
      
      fetch(scriptUrl + '?t=' + Date.now())
        .then(r => r.text())
        .then(text => {
          status.innerHTML = '<span class="success">✅ Connected!</span><br>' + text.substring(0, 200);
        })
        .catch(err => {
          status.innerHTML = '<span class="error">❌ Error: ' + err.message + '</span>';
        });
    }

    function createFolder() {
      scriptUrl = document.getElementById('scriptUrl').value.trim();
      const status = document.getElementById('status');
      
      if (!scriptUrl) {
        status.innerHTML = '<span class="error">❌ Please enter URL</span>';
        return;
      }
      
      status.innerHTML = '⏳ Creating folder via Apps Script...';
      
      // Create a dummy file which will create the folder
      const now = new Date();
      const html = `<!DOCTYPE html>
<html>
<body>
  <h1>Folder Creation Trigger</h1>
  <p>This file was uploaded to create the AttendanceASLS folder.</p>
  <p>Time: ${now.toLocaleString()}</p>
</body>
</html>`;
      
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = scriptUrl;
      form.target = 'upload_frame';
      form.style.display = 'none';
      
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = 'data';
      input.value = JSON.stringify({
        filename: 'folder_trigger.html',
        content: html,
        folderName: 'AttendanceASLS'  // This creates the folder!
      });
      
      form.appendChild(input);
      document.body.appendChild(form);
      
      const iframe = document.createElement('iframe');
      iframe.name = 'upload_frame';
      iframe.style.display = 'none';
      document.body.appendChild(iframe);
      
      iframe.onload = function() {
        status.innerHTML = '<span class="success">✅ Upload complete!</span><br>' +
                          'The folder "AttendanceASLS" should now exist in your Drive.<br>' +
                          'Click "Check if folder exists" to verify.';
        
        setTimeout(() => {
          document.body.removeChild(form);
          document.body.removeChild(iframe);
        }, 2000);
      };
      
      form.submit();
    }

    function checkFolder() {
      scriptUrl = document.getElementById('scriptUrl').value.trim();
      const status = document.getElementById('status');
      
      if (!scriptUrl) {
        status.innerHTML = '<span class="error">❌ Please enter URL</span>';
        return;
      }
      
      status.innerHTML = '⏳ Checking Drive...';
      
      // Try to access the folder by uploading another file to it
      const now = new Date();
      const html = `<!DOCTYPE html>
<html>
<body>
  <h1>Folder Check</h1>
  <p>If you can see this, the folder exists!</p>
  <p>Time: ${now.toLocaleString()}</p>
</body>
</html>`;
      
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = scriptUrl;
      form.target = 'check_frame';
      form.style.display = 'none';
      
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = 'data';
      input.value = JSON.stringify({
        filename: 'check_file.html',
        content: html,
        folderName: 'AttendanceASLS'  // Try to put in existing folder
      });
      
      form.appendChild(input);
      document.body.appendChild(form);
      
      const iframe = document.createElement('iframe');
      iframe.name = 'check_frame';
      iframe.style.display = 'none';
      document.body.appendChild(iframe);
      
      iframe.onload = function() {
        status.innerHTML = '<span class="success">✅ Check complete!</span><br>' +
                          'If no errors appeared, the folder exists.<br>' +
                          '<strong>Please check your Google Drive manually:</strong><br>' +
                          '1. Go to drive.google.com<br>' +
                          '2. Search for "AttendanceASLS"<br>' +
                          '3. Look for files named "folder_trigger.html" and "check_file.html"';
        
        setTimeout(() => {
          document.body.removeChild(form);
          document.body.removeChild(iframe);
        }, 2000);
      };
      
      form.submit();
    }
  </script>
</body>
</html>
