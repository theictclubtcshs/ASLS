<!DOCTYPE html>
<html>
<head>
  <title>Google Drive Folder Creator</title>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 500px;
    }
    h1 {
      color: #186E00;
      margin-bottom: 30px;
    }
    button {
      background: #4285F4;
      color: white;
      border: none;
      padding: 20px 40px;
      font-size: 24px;
      border-radius: 50px;
      cursor: pointer;
      margin: 20px 0;
      transition: all 0.3s;
      box-shadow: 0 5px 15px rgba(66, 133, 244, 0.3);
    }
    button:hover {
      background: #3367D6;
      transform: scale(1.05);
    }
    button:disabled {
      background: #a5c1f9;
      cursor: not-allowed;
      transform: none;
    }
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #f0f0f0;
      min-height: 60px;
      text-align: left;
      font-family: monospace;
    }
    .success {
      color: #27ae60;
      font-weight: bold;
    }
    .error {
      color: #e74c3c;
      font-weight: bold;
    }
    .info {
      margin-top: 20px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📁 Google Drive Folder Creator</h1>
    <p>Click the button to create "AttendanceASLS" folder in your Google Drive</p>
    
    <button id="createBtn" onclick="startAuth()">
      📂 CREATE FOLDER
    </button>
    
    <div class="status" id="status">
      Ready to create folder...
    </div>
    
    <div class="info">
      ⚡ A popup window will appear for you to sign in<br>
      ⚡ The folder will be created in your Google Drive root
    </div>
  </div>

  <script>
    // Your GitHub Pages URL
    const REDIRECT_URI = 'https://theictclubtcshs.github.io/ASLS/Tester.html';
    const CLIENT_ID = '407408718192.apps.googleusercontent.com'; // Public test client
    const SCOPES = 'https://www.googleapis.com/auth/drive.file';

    let authWindow = null;
    let accessToken = null;

    function startAuth() {
      const status = document.getElementById('status');
      status.innerHTML = '⏳ Opening login window...';
      
      // Create the OAuth URL
      const authUrl = 'https://accounts.google.com/o/oauth2/v2/auth?' +
        'client_id=' + CLIENT_ID +
        '&redirect_uri=' + encodeURIComponent(REDIRECT_URI) +
        '&response_type=token' +
        '&scope=' + encodeURIComponent(SCOPES) +
        '&include_granted_scopes=true' +
        '&state=pass-through-value';
      
      // Open popup window
      authWindow = window.open(
        authUrl,
        'google-auth',
        'width=600,height=600,left=200,top=200'
      );
      
      // Check if popup was blocked
      if (!authWindow || authWindow.closed || typeof authWindow.closed === 'undefined') {
        status.innerHTML = '❌ Popup was blocked. Please allow popups for this site.';
      }
      
      // Start checking for the token
      checkForToken();
    }

    function checkForToken() {
      if (authWindow && !authWindow.closed) {
        setTimeout(checkForToken, 500);
        return;
      }
      
      // Check URL fragment for access token
      if (authWindow && authWindow.location && authWindow.location.href) {
        const hash = authWindow.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const token = params.get('access_token');
        
        if (token) {
          accessToken = token;
          document.getElementById('status').innerHTML = '✅ Signed in successfully!';
          createFolder();
        }
      }
      
      authWindow = null;
    }

    // Create folder in Google Drive
    async function createFolder() {
      const status = document.getElementById('status');
      const btn = document.getElementById('createBtn');
      
      if (!accessToken) {
        status.innerHTML = '❌ Not signed in. Please try again.';
        return;
      }

      try {
        status.innerHTML = '⏳ Creating folder "AttendanceASLS"...';
        
        // Create folder metadata
        const metadata = {
          name: 'AttendanceASLS',
          mimeType: 'application/vnd.google-apps.folder'
        };

        // Send request to create folder
        const response = await fetch('https://www.googleapis.com/drive/v3/files', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + accessToken,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(metadata)
        });

        const data = await response.json();

        if (response.ok) {
          status.innerHTML = `
            <span class="success">✅ Folder created successfully!</span><br>
            <strong>Folder Name:</strong> AttendanceASLS<br>
            <strong>Folder ID:</strong> ${data.id}<br>
            <strong>Link:</strong> <a href="https://drive.google.com/drive/folders/${data.id}" target="_blank">Open in Drive</a>
          `;
        } else {
          throw new Error(data.error.message);
        }
      } catch (error) {
        status.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
      }
    }

    // Check if we have token in URL (when redirected back)
    function checkHashForToken() {
      if (window.location.hash) {
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const token = params.get('access_token');
        
        if (token) {
          accessToken = token;
          document.getElementById('status').innerHTML = '✅ Signed in successfully!';
          createFolder();
          
          // Clean URL
          window.location.hash = '';
        }
      }
    }

    // Run on page load
    window.onload = checkHashForToken;
  </script>
</body>
</html>
