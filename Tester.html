<!DOCTYPE html>
<html>
<head>
  <title>Google Drive Folder Creator</title>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 500px;
    }
    h1 {
      color: #186E00;
      margin-bottom: 30px;
    }
    button {
      background: #4285F4;
      color: white;
      border: none;
      padding: 20px 40px;
      font-size: 24px;
      border-radius: 50px;
      cursor: pointer;
      margin: 20px 0;
      transition: all 0.3s;
      box-shadow: 0 5px 15px rgba(66, 133, 244, 0.3);
    }
    button:hover {
      background: #3367D6;
      transform: scale(1.05);
    }
    button:disabled {
      background: #a5c1f9;
      cursor: not-allowed;
      transform: none;
    }
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #f0f0f0;
      min-height: 60px;
      text-align: left;
      font-family: monospace;
    }
    .success {
      color: #27ae60;
      font-weight: bold;
    }
    .error {
      color: #e74c3c;
      font-weight: bold;
    }
    .info {
      margin-top: 20px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📁 Google Drive Folder Creator</h1>
    <p>Click the button to create "AttendanceASLS" folder in your Google Drive</p>
    
    <button id="createBtn" onclick="createFolder()">
      📂 CREATE FOLDER
    </button>
    
    <div class="status" id="status">
      Ready to create folder...
    </div>
    
    <div class="info">
      ⚡ You'll be prompted to sign in to your Google account<br>
      ⚡ The folder will be created in your Google Drive root
    </div>
  </div>

  <script>
    // Google API Client ID - This is a public test client
    const CLIENT_ID = '407408718192.apps.googleusercontent.com';
    const API_KEY = 'AIzaSyB41drUbLJ7Zyh8lqQqQqQqQqQqQqQqQqQ'; // Public test API key
    const SCOPES = 'https://www.googleapis.com/auth/drive.file';

    let tokenClient;
    let accessToken = null;

    // Load the Google API
    function loadGoogleAPI() {
      const status = document.getElementById('status');
      status.innerHTML = 'Loading Google API...';
      
      const script = document.createElement('script');
      script.src = 'https://accounts.google.com/gsi/client';
      script.onload = initializeTokenClient;
      document.head.appendChild(script);
    }

    // Initialize the token client
    function initializeTokenClient() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: (response) => {
          if (response.access_token) {
            accessToken = response.access_token;
            document.getElementById('status').innerHTML = '✅ Signed in successfully!';
            createFolder(); // Automatically create folder after sign in
          } else {
            document.getElementById('status').innerHTML = '❌ Failed to get access token';
          }
        },
      });
      
      document.getElementById('status').innerHTML = 'Ready. Click button to sign in and create folder.';
    }

    // Create folder in Google Drive
    async function createFolder() {
      const status = document.getElementById('status');
      const btn = document.getElementById('createBtn');
      
      if (!accessToken) {
        status.innerHTML = '⏳ Requesting access to your Google Drive...';
        btn.disabled = true;
        tokenClient.requestAccessToken();
        return;
      }

      try {
        status.innerHTML = '⏳ Creating folder "AttendanceASLS"...';
        
        // Create folder metadata
        const metadata = {
          name: 'AttendanceASLS',
          mimeType: 'application/vnd.google-apps.folder'
        };

        // Send request to create folder
        const response = await fetch('https://www.googleapis.com/drive/v3/files', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + accessToken,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(metadata)
        });

        const data = await response.json();

        if (response.ok) {
          status.innerHTML = `
            <span class="success">✅ Folder created successfully!</span><br>
            <strong>Folder Name:</strong> AttendanceASLS<br>
            <strong>Folder ID:</strong> ${data.id}<br>
            <strong>Link:</strong> <a href="https://drive.google.com/drive/folders/${data.id}" target="_blank">Open in Drive</a>
          `;
        } else {
          throw new Error(data.error.message);
        }
      } catch (error) {
        status.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
      } finally {
        btn.disabled = false;
      }
    }

    // List folders in Drive (for testing)
    async function listFolders() {
      if (!accessToken) {
        tokenClient.requestAccessToken();
        return;
      }

      try {
        const response = await fetch('https://www.googleapis.com/drive/v3/files?q=mimeType="application/vnd.google-apps.folder"&fields=files(id,name)', {
          headers: {
            'Authorization': 'Bearer ' + accessToken
          }
        });

        const data = await response.json();
        let folderList = '';
        if (data.files && data.files.length > 0) {
          folderList = data.files.map(f => `${f.name} (${f.id})`).join('<br>');
        } else {
          folderList = 'No folders found';
        }
        
        document.getElementById('status').innerHTML = '📁 Your folders:<br>' + folderList;
      } catch (error) {
        document.getElementById('status').innerHTML = '❌ Error: ' + error.message;
      }
    }

    // Load the API when page loads
    window.onload = loadGoogleAPI;
  </script>
</body>
</html>
