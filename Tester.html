<!DOCTYPE html>
<html>
<head>
  <title>Create Drive Folder via Apps Script</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 500px;
    }
    input {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      background: #4285F4;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 10px;
      cursor: pointer;
      margin: 10px 0;
    }
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #f0f0f0;
      min-height: 60px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📁 Create Drive Folder</h1>
    <p>Using your existing Apps Script</p>
    
    <input type="text" id="scriptUrl" placeholder="Paste your Apps Script URL here" 
           value="https://script.google.com/macros/s/AKfycbwADqDZgDjv0qEOv-V1Fbt4ssKkFccW4vx7EbMzn6aXi7BQ5qyFkMqUzI7Ab1W9XQ/exec">
    
    <button onclick="createFolder()">📂 CREATE AttendanceASLS FOLDER</button>
    
    <div class="status" id="status">
      Ready. Paste your Apps Script URL and click the button.
    </div>
  </div>

  <script>
    function createFolder() {
      const url = document.getElementById('scriptUrl').value.trim();
      const status = document.getElementById('status');
      
      if (!url) {
        status.innerHTML = '❌ Please enter your Apps Script URL';
        return;
      }
      
      status.innerHTML = '⏳ Creating folder...';
      
      // Create a simple HTML file that will trigger folder creation
      const html = `<!DOCTYPE html>
<html>
<body>
  <script>
    // This will run in the iframe
    window.parent.postMessage({ status: 'Folder created! Check your Drive' }, '*');
  <\/script>
</body>
</html>`;
      
      // Create form and submit
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = url;
      form.target = 'upload_frame';
      form.style.display = 'none';
      
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = 'data';
      input.value = JSON.stringify({
        filename: 'folder_creator.html',
        content: html,
        folderName: 'AttendanceASLS'
      });
      
      form.appendChild(input);
      document.body.appendChild(form);
      
      const iframe = document.createElement('iframe');
      iframe.name = 'upload_frame';
      iframe.style.display = 'none';
      document.body.appendChild(iframe);
      
      iframe.onload = function() {
        status.innerHTML = '✅ Folder "AttendanceASLS" should now exist in your Drive!';
        
        setTimeout(() => {
          document.body.removeChild(form);
          document.body.removeChild(iframe);
        }, 2000);
      };
      
      form.submit();
    }
  </script>
</body>
</html>
