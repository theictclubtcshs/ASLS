<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ASLS - Admin Panel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      background: white;
      padding: 30px;
      border-radius: 30px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    .header h1 {
      font-size: 2.5rem;
      color: #186E00;
    }

    .header-actions {
      display: flex;
      gap: 15px;
    }

    .btn {
      padding: 15px 30px;
      border: none;
      border-radius: 15px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: #186E00;
      color: white;
    }

    .btn-secondary {
      background: #3498db;
      color: white;
    }

    .btn-danger {
      background: #e74c3c;
      color: white;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .stat-value {
      font-size: 2.8rem;
      font-weight: 800;
      color: #186E00;
      margin-bottom: 5px;
    }

    .stat-label {
      color: #7f8c8d;
      font-size: 1rem;
      text-transform: uppercase;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .photo-card {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      transition: transform 0.3s;
      cursor: pointer;
    }

    .photo-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.2);
    }

    .photo-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .photo-info {
      padding: 15px;
    }

    .photo-name {
      font-weight: 700;
      font-size: 1.1rem;
      color: #2c3e50;
    }

    .photo-details {
      color: #7f8c8d;
      font-size: 0.9rem;
      margin-top: 5px;
    }

    .photo-time {
      color: #95a5a6;
      font-size: 0.8rem;
      margin-top: 5px;
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
    }

    .close-modal {
      position: absolute;
      top: 20px;
      right: 20px;
      color: white;
      font-size: 2rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>📊 ASLS Admin Panel</h1>
        <p>Manage and export logs with photos</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-primary" onclick="exportAll()">📥 Export All</button>
        <button class="btn btn-secondary" onclick="exportPhotos()">📸 Export Photos</button>
        <button class="btn btn-danger" onclick="clearDB()">⚠️ Clear All</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="totalLogs">0</div>
        <div class="stat-label">Total Logs</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalPhotos">0</div>
        <div class="stat-label">With Photos</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="todayLogs">0</div>
        <div class="stat-label">Today</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="dbSize">0 MB</div>
        <div class="stat-label">Storage Used</div>
      </div>
    </div>

    <div class="gallery" id="gallery"></div>
  </div>

  <div class="modal" id="modal" onclick="this.style.display='none'">
    <span class="close-modal">&times;</span>
    <img id="modalImage" src="">
  </div>

  <script>
    const DB_NAME = 'ASLS_Ultimate';
    const STORE_NAME = 'logs';
    let db = null;

    // Initialize IndexedDB
    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        
        request.onsuccess = (event) => {
          db = event.target.result;
          resolve(db);
          loadGallery();
        };
        
        request.onerror = () => reject(request.error);
      });
    }

    // Get all logs
    function getAllLogs() {
      return new Promise((resolve, reject) => {
        if (!db) {
          reject(new Error('DB not initialized'));
          return;
        }
        
        const transaction = db.transaction([STORE_NAME], 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.getAll();
        
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    // Update stats
    async function updateStats() {
      const logs = await getAllLogs();
      const today = new Date().toISOString().split('T')[0];
      const todayLogs = logs.filter(l => l.date === today).length;
      const withPhotos = logs.filter(l => l.photo).length;
      
      // Calculate size
      const size = new Blob([JSON.stringify(logs)]).size / (1024 * 1024);
      
      document.getElementById('totalLogs').textContent = logs.length;
      document.getElementById('totalPhotos').textContent = withPhotos;
      document.getElementById('todayLogs').textContent = todayLogs;
      document.getElementById('dbSize').textContent = size.toFixed(2) + ' MB';
    }

    // Load gallery
    async function loadGallery() {
      const logs = await getAllLogs();
      const gallery = document.getElementById('gallery');
      
      if (logs.length === 0) {
        gallery.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 50px; color: white;">No logs yet</div>';
        return;
      }
      
      let html = '';
      logs.slice().reverse().forEach(log => {
        if (log.photo) {
          html += `
            <div class="photo-card" onclick="showImage('${log.photo}')">
              <img src="${log.photo}" alt="${log.name}">
              <div class="photo-info">
                <div class="photo-name">${log.name}</div>
                <div class="photo-details">${log.lrn} | ${log.grade}-${log.section}</div>
                <div class="photo-details">${log.action} | ${log.period}</div>
                <div class="photo-time">${new Date(log.timestamp).toLocaleString()}</div>
              </div>
            </div>
          `;
        }
      });
      
      gallery.innerHTML = html;
      updateStats();
    }

    // Show image in modal
    function showImage(src) {
      document.getElementById('modalImage').src = src;
      document.getElementById('modal').style.display = 'flex';
    }

    // Export all data
    async function exportAll() {
      const logs = await getAllLogs();
      const blob = new Blob([JSON.stringify(logs, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      
      const a = document.createElement('a');
      a.href = url;
      a.download = `asls_backup_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      
      URL.revokeObjectURL(url);
    }

    // Export photos as zip (requires JSZip)
    async function exportPhotos() {
      // Load JSZip from CDN
      if (typeof JSZip === 'undefined') {
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
        document.head.appendChild(script);
        await new Promise(resolve => script.onload = resolve);
      }
      
      const logs = await getAllLogs();
      const zip = new JSZip();
      
      logs.forEach((log, index) => {
        if (log.photo) {
          const base64Data = log.photo.split(',')[1];
          const filename = `${log.date}_${log.lrn}_${log.name}_${log.action}.jpg`;
          zip.file(filename, base64Data, { base64: true });
        }
      });
      
      const content = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(content);
      
      const a = document.createElement('a');
      a.href = url;
      a.download = `asls_photos_${new Date().toISOString().split('T')[0]}.zip`;
      a.click();
      
      URL.revokeObjectURL(url);
    }

    // Clear database
    async function clearDB() {
      if (!confirm('⚠️ Are you sure? This will delete ALL logs and photos!')) {
        return;
      }
      
      const transaction = db.transaction([STORE_NAME], 'readwrite');
      const store = transaction.objectStore(STORE_NAME);
      store.clear();
      
      transaction.oncomplete = () => {
        loadGallery();
      };
    }

    // Initialize on load
    window.onload = async () => {
      await initDB();
      setInterval(updateStats, 5000);
    };
  </script>
</body>
</html>
