<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASLS - Admin Panel</title>
  <style>
    /* ===== ADMIN PANEL CSS ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 30px;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    
    .header {
      background: white;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    
    .header h1 {
      color: #186E00;
      font-size: 2.5rem;
    }
    
    .btn-group {
      display: flex;
      gap: 15px;
    }
    
    .export-btn, .refresh-btn {
      padding: 15px 30px;
      border: none;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .export-btn {
      background: #186E00;
      color: white;
    }
    
    .refresh-btn {
      background: #3498db;
      color: white;
    }
    
    .export-btn:hover, .refresh-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
      margin-bottom: 30px;
    }
    
    .stat-card {
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }
    
    .stat-value {
      font-size: 3rem;
      font-weight: 800;
      color: #186E00;
    }
    
    .github-section {
      background: #24292e;
      color: white;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
    }
    
    .input-group {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 15px;
      margin-top: 20px;
    }
    
    .input-group input {
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: rgba(255,255,255,0.1);
      color: white;
    }
    
    .upload-btn {
      background: #2ea44f;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 10px;
      cursor: pointer;
    }
    
    .search-section {
      background: white;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 20px;
      display: flex;
      gap: 15px;
    }
    
    .search-box, .filter-select {
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1rem;
    }
    
    .search-box {
      flex: 1;
    }
    
    .logs-container {
      background: white;
      border-radius: 20px;
      padding: 20px;
      overflow-x: auto;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1200px;
    }
    
    th {
      background: #f8f9fa;
      padding: 15px;
      text-align: left;
      border-bottom: 3px solid #186E00;
    }
    
    td {
      padding: 12px 10px;
      border-bottom: 1px solid #ecf0f1;
    }
    
    .photo-thumb {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      object-fit: cover;
      cursor: pointer;
      border: 3px solid #186E00;
    }
    
    .view-photo-btn {
      background: #3498db;
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 5px;
      cursor: pointer;
      margin-left: 5px;
    }
    
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    
    .modal-content {
      position: relative;
      max-width: 90%;
    }
    
    .modal-image {
      max-width: 100%;
      max-height: 90vh;
      border-radius: 10px;
    }
    
    .modal-close {
      position: absolute;
      top: -40px;
      right: -40px;
      background: white;
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
    }
    
    .modal-info {
      position: absolute;
      bottom: -50px;
      left: 0;
      right: 0;
      text-align: center;
      color: white;
    }
    
    .pagination {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }
    
    .page-btn {
      padding: 10px 20px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      cursor: pointer;
    }
    
    .page-btn.active {
      background: #186E00;
      color: white;
      border-color: #186E00;
    }
  </style>
  
  <!-- Load student data from separate file -->
  <script src="students.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>📊 ASLS Admin Panel</h1>
        <p>Loaded <span id="studentCountDisplay"></span> students from students.js</p>
      </div>
      <div class="btn-group">
        <button class="export-btn" onclick="exportAllLogs()">⚡ EXPORT ALL</button>
        <button class="refresh-btn" onclick="loadData()">🔄 Refresh</button>
      </div>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="totalLogs">0</div>
        <div>Total Logs</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="todayLogs">0</div>
        <div>Today</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="storageUsed">0 MB</div>
        <div>Storage Used</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="uniqueStudents">0</div>
        <div>Unique Today</div>
      </div>
    </div>
    
    <div class="github-section">
      <h2>📤 Upload to GitHub</h2>
      <div class="input-group">
        <input type="password" id="githubToken" placeholder="GitHub Token">
        <input type="text" id="repoPath" placeholder="username/repo" value="theictclubtcshs/ASLS">
        <button class="upload-btn" onclick="uploadToGitHub()">🚀 Upload All</button>
      </div>
    </div>
    
    <div class="search-section">
      <input type="text" class="search-box" id="searchInput" placeholder="🔍 Search..." onkeyup="filterLogs()">
      <select class="filter-select" id="actionFilter" onchange="filterLogs()">
        <option value="all">All Actions</option>
        <option value="Log in">Log In</option>
        <option value="Log out">Log Out</option>
      </select>
    </div>
    
    <div class="logs-container">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Photo</th>
            <th>Name</th>
            <th>LRN</th>
            <th>Sex</th>
            <th>Grade</th>
            <th>Section</th>
            <th>Action</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="logsBody">
          <tr><td colspan="9" style="text-align: center; padding: 50px;">Loading...</td></tr>
        </tbody>
      </table>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <!-- Photo Modal -->
  <div class="modal" id="photoModal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <img class="modal-image" id="modalImage" src="">
      <div class="modal-info" id="modalInfo"></div>
    </div>
  </div>

  <script>
    // ============================================
    // ASLS ADMIN PANEL
    // ============================================
    
    // Show student count
    document.getElementById('studentCountDisplay').textContent = STUDENTS_DATA.length;
    
    let allLogs = [];
    let filteredLogs = [];
    let currentPage = 1;
    const logsPerPage = 50;
    
    function loadData() {
      allLogs = JSON.parse(localStorage.getItem('asls_master') || '[]');
      filteredLogs = [...allLogs];
      updateStats();
      filterLogs();
    }
    
    function updateStats() {
      const total = allLogs.length;
      const today = new Date().toISOString().split('T')[0];
      const todayLogs = allLogs.filter(l => l.timestamp.startsWith(today)).length;
      const size = new Blob([JSON.stringify(allLogs)]).size / (1024 * 1024);
      const uniqueToday = new Set(allLogs.filter(l => l.timestamp.startsWith(today)).map(l => l.lrn)).size;
      
      document.getElementById('totalLogs').textContent = total;
      document.getElementById('todayLogs').textContent = todayLogs;
      document.getElementById('storageUsed').textContent = size.toFixed(2) + ' MB';
      document.getElementById('uniqueStudents').textContent = uniqueToday;
    }
    
    function filterLogs() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const actionFilter = document.getElementById('actionFilter').value;
      
      filteredLogs = allLogs.filter(log => {
        if (searchTerm && !log.name.toLowerCase().includes(searchTerm) && !log.lrn.includes(searchTerm)) {
          return false;
        }
        if (actionFilter !== 'all' && log.action !== actionFilter) {
          return false;
        }
        return true;
      });
      
      filteredLogs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      currentPage = 1;
      renderTable();
    }
    
    function renderTable() {
      const start = (currentPage - 1) * logsPerPage;
      const end = start + logsPerPage;
      const pageLogs = filteredLogs.slice(start, end);
      
      if (filteredLogs.length === 0) {
        document.getElementById('logsBody').innerHTML = '<tr><td colspan="9" style="text-align: center; padding: 50px;">No logs found</td></tr>';
        return;
      }
      
      let html = '';
      pageLogs.forEach(log => {
        const timeStr = new Date(log.timestamp).toLocaleTimeString();
        
        html += `
          <tr>
            <td>${timeStr}<br><small>${log.date}</small></td>
            <td>
              ${log.photo && log.photo !== 'no-photo' ? 
                `<img src="${log.photo}" class="photo-thumb" onclick="viewPhoto('${log.photo}', '${log.name}', '${log.lrn}')">` : 
                'No photo'}
            </td>
            <td><strong>${log.name}</strong></td>
            <td>${log.lrn}</td>
            <td>${log.sex}</td>
            <td>${log.grade}</td>
            <td>${log.section}</td>
            <td><span class="badge ${log.action === 'Log in' ? 'badge-success' : 'badge-danger'}">${log.action}</span></td>
            <td>
              ✅ Verified
              ${log.photo && log.photo !== 'no-photo' ? 
                `<button class="view-photo-btn" onclick="viewPhoto('${log.photo}', '${log.name}', '${log.lrn}')">View</button>` : ''}
            </td>
          </tr>
        `;
      });
      
      document.getElementById('logsBody').innerHTML = html;
    }
    
    function viewPhoto(photoData, name, lrn) {
      document.getElementById('modalImage').src = photoData;
      document.getElementById('modalInfo').innerHTML = `<strong>${name}</strong> (${lrn})`;
      document.getElementById('photoModal').style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }
    
    function closeModal() {
      document.getElementById('photoModal').style.display = 'none';
      document.body.style.overflow = 'auto';
    }
    
    function exportAllLogs() {
      const blob = new Blob([JSON.stringify(allLogs, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `asls_export_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }
    
    async function uploadToGitHub() {
      const token = document.getElementById('githubToken').value;
      const repoPath = document.getElementById('repoPath').value;
      const [username, repo] = repoPath.split('/');
      
      if (!token || !username || !repo) {
        alert('Please enter token and repository');
        return;
      }
      
      // Group by date for organized upload
      const byDate = {};
      allLogs.forEach(log => {
        const date = log.timestamp.split('T')[0];
        if (!byDate[date]) byDate[date] = [];
        byDate[date].push(log);
      });
      
      let success = 0;
      for (const [date, logs] of Object.entries(byDate)) {
        try {
          const path = `logs/${date}/logs.json`;
          const content = btoa(unescape(encodeURIComponent(JSON.stringify(logs, null, 2))));
          
          const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${path}`, {
            method: 'PUT',
            headers: {
              'Authorization': `token ${token}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              message: `Update logs for ${date}`,
              content: content,
              branch: 'main'
            })
          });
          
          if (response.ok) success++;
        } catch (e) {}
      }
      
      alert(`Uploaded ${success} files successfully!`);
    }
    
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });
    
    window.onload = loadData;
    setInterval(loadData, 30000);
  </script>
</body>
</html>
