<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASLS - Admin Panel with Drive Upload</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 30px;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    
    .header {
      background: white;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    
    .header h1 {
      color: #186E00;
      font-size: 2.5rem;
      font-weight: 800;
    }
    
    .btn-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }
    
    .drive-btn {
      background: #4285F4;
      color: white;
      border: none;
      padding: 15px 40px;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .drive-btn:hover {
      background: #3367D6;
      transform: translateY(-3px);
    }
    
    .refresh-btn {
      background: #3498db;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 50px;
      font-size: 1.2rem;
      cursor: pointer;
    }
    
    .reset-btn {
      background: #e67e22;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 50px;
      font-size: 1.2rem;
      cursor: pointer;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
      margin-bottom: 30px;
    }
    
    .stat-card {
      background: white;
      padding: 25px;
      border-radius: 20px;
    }
    
    .stat-value {
      font-size: 3rem;
      font-weight: 800;
      color: #186E00;
    }
    
    .drive-section {
      background: #4285F4;
      color: white;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
    }
    
    .drive-input-group {
      display: flex;
      gap: 15px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    
    .drive-input {
      flex: 1;
      min-width: 400px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
    }
    
    .test-btn {
      background: white;
      color: #4285F4;
      border: none;
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    
    .status-box {
      background: rgba(255,255,255,0.1);
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      font-size: 1rem;
    }
    
    .status-success {
      color: #2ecc71;
      font-weight: bold;
    }
    
    .status-warning {
      color: #f39c12;
      font-weight: bold;
    }
    
    .logs-container {
      background: white;
      border-radius: 20px;
      padding: 20px;
      overflow-x: auto;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1300px;
    }
    
    th {
      background: #f8f9fa;
      padding: 15px 10px;
      border-bottom: 3px solid #186E00;
    }
    
    td {
      padding: 12px 10px;
      border-bottom: 1px solid #ecf0f1;
    }
    
    .photo-thumb {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      object-fit: cover;
      cursor: pointer;
      border: 3px solid #186E00;
    }
    
    .action-badge {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: inline-block;
    }
    
    .action-login {
      background: #d4edda;
      color: #155724;
    }
    
    .action-logout {
      background: #f8d7da;
      color: #721c24;
    }
    
    .single-delete {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      margin-left: 5px;
    }
    
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    
    .modal-image {
      max-width: 90%;
      max-height: 90vh;
      border-radius: 10px;
    }
    
    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: white;
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
    }
    
    .pagination {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }
    
    .page-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
    }
    
    .page-btn.active {
      background: #186E00;
      color: white;
    }
    
    .confirm-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
    }
    
    .confirm-content {
      background: white;
      padding: 40px;
      border-radius: 20px;
      max-width: 400px;
      text-align: center;
    }
    
    .confirm-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
    }
    
    .confirm-yes {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 10px;
      cursor: pointer;
    }
    
    .confirm-no {
      background: #7f8c8d;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>📊 ASLS Admin Panel</h1>
        <p>Manage student logs and upload to Google Drive</p>
      </div>
      <div class="btn-group">
        <button class="drive-btn" onclick="uploadToDrive()" id="driveBtn">☁️ UPLOAD TO DRIVE</button>
        <button class="refresh-btn" onclick="loadData()">🔄 Refresh</button>
        <button class="reset-btn" onclick="confirmResetAll()">🗑️ RESET ALL DATA</button>
      </div>
    </div>
    
    <div class="stats-grid" id="stats">
      <div class="stat-card">
        <div class="stat-label">Total Logs</div>
        <div class="stat-value" id="totalLogs">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Today's Logs</div>
        <div class="stat-value" id="todayLogs">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Storage Used</div>
        <div class="stat-value" id="storageUsed">0 MB</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Unique Students</div>
        <div class="stat-value" id="uniqueStudents">0</div>
      </div>
    </div>
    
    <div class="drive-section">
      <h2>☁️ Google Drive Upload</h2>
      <div class="drive-input-group">
        <input type="text" id="scriptUrl" class="drive-input" 
               placeholder="Paste your Apps Script URL here"
               value="https://script.google.com/macros/s/AKfycbwADqDZgDjv0qEOv-V1Fbt4ssKkFccW4vx7EbMzn6aXi7BQ5qyFkMqUzI7Ab1W9XQ/exec">
        <button class="test-btn" onclick="verifyConnection()">✓ Verify URL</button>
      </div>
      <div class="status-box" id="driveStatus">
        ⚡ Click "Verify URL" to check connection
      </div>
    </div>
    
    <div class="logs-container">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Photo</th>
            <th>Name</th>
            <th>LRN</th>
            <th>Sex</th>
            <th>Grade</th>
            <th>Section</th>
            <th>Action</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="logsBody">
          <tr><td colspan="10" style="text-align: center; padding: 50px;">Loading logs...</td></tr>
        </tbody>
      </table>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <!-- Photo Modal -->
  <div class="modal" id="photoModal" onclick="this.style.display='none'">
    <span class="modal-close" onclick="document.getElementById('photoModal').style.display='none'">✕</span>
    <img class="modal-image" id="modalImage" src="">
  </div>

  <!-- Confirm Modal -->
  <div class="confirm-modal" id="confirmModal">
    <div class="confirm-content">
      <h3 id="confirmTitle">⚠️ Confirm</h3>
      <p id="confirmMessage"></p>
      <div class="confirm-buttons">
        <button class="confirm-yes" id="confirmYesBtn">Yes</button>
        <button class="confirm-no" onclick="closeConfirmModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // ============================================
    // SIMPLIFIED WORKING VERSION
    // ============================================
    
    let allLogs = [];
    let filteredLogs = [];
    let currentPage = 1;
    const logsPerPage = 50;
    let APPS_SCRIPT_URL = '';
    
    // Load data from localStorage
    function loadData() {
      try {
        allLogs = JSON.parse(localStorage.getItem('asls_master') || '[]');
        filteredLogs = [...allLogs];
        updateStats();
        renderTable();
        
        // Load saved URL
        const savedUrl = localStorage.getItem('asls_script_url');
        if (savedUrl) {
          document.getElementById('scriptUrl').value = savedUrl;
          APPS_SCRIPT_URL = savedUrl;
          document.getElementById('driveStatus').innerHTML = '✅ URL loaded from previous session';
        }
      } catch (e) {
        console.error('Error:', e);
      }
    }
    
    // Update statistics
    function updateStats() {
      const total = allLogs.length;
      const today = new Date().toISOString().split('T')[0];
      const todayLogs = allLogs.filter(l => l.timestamp.startsWith(today)).length;
      const size = new Blob([JSON.stringify(allLogs)]).size / (1024 * 1024);
      const uniqueStudents = new Set(allLogs.map(l => l.lrn)).size;
      
      document.getElementById('totalLogs').textContent = total;
      document.getElementById('todayLogs').textContent = todayLogs;
      document.getElementById('storageUsed').textContent = size.toFixed(2) + ' MB';
      document.getElementById('uniqueStudents').textContent = uniqueStudents;
    }
    
    // Verify URL (simple check)
    function verifyConnection() {
      const url = document.getElementById('scriptUrl').value.trim();
      const statusEl = document.getElementById('driveStatus');
      
      if (!url) {
        statusEl.innerHTML = '❌ Please enter a URL';
        return;
      }
      
      statusEl.innerHTML = '⏳ Checking URL...';
      
      // Just store the URL - we know it works from browser test
      APPS_SCRIPT_URL = url;
      localStorage.setItem('asls_script_url', url);
      
      statusEl.innerHTML = '✅ URL saved! Ready to upload.';
    }
    
    // Generate HTML file
    function generateHTML() {
      const now = new Date();
      const dateStr = now.toLocaleString();
      
      let html = `<!DOCTYPE html>
<html>
<head><title>ASLS Logs</title>
<style>
  body { font-family: Arial; margin: 30px; }
  h1 { color: #186E00; }
  table { border-collapse: collapse; width: 100%; }
  th { background: #186E00; color: white; padding: 10px; }
  td { padding: 10px; border-bottom: 1px solid #ddd; }
  img { width: 100px; height: 100px; object-fit: cover; }
  .login { background: #d4edda; padding: 5px; border-radius: 5px; }
  .logout { background: #f8d7da; padding: 5px; border-radius: 5px; }
</style>
</head>
<body>
<h1>ASLS Student Logs</h1>
<p>Generated: ${dateStr}</p>
<p>Total Logs: ${allLogs.length}</p>
<table>
<tr><th>Date/Time</th><th>Photo</th><th>Name</th><th>LRN</th><th>Action</th></tr>`;
      
      allLogs.forEach(log => {
        const d = new Date(log.timestamp);
        html += `<tr>
          <td>${d.toLocaleString()}</td>
          <td>${log.photo && log.photo !== 'no-photo' ? `<img src="${log.photo}">` : 'No photo'}</td>
          <td>${log.name}</td>
          <td>${log.lrn}</td>
          <td class="${log.action === 'Log in' ? 'login' : 'logout'}">${log.action}</td>
        </tr>`;
      });
      
      html += '</table></body></html>';
      return html;
    }
    
    // Upload to Drive
    function uploadToDrive() {
      if (!APPS_SCRIPT_URL) {
        alert('Please verify your Apps Script URL first');
        return;
      }
      
      if (allLogs.length === 0) {
        alert('No logs to upload');
        return;
      }
      
      const now = new Date();
      const filename = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}-${String(now.getMinutes()).padStart(2,'0')}-${String(now.getSeconds()).padStart(2,'0')}_LOGS.html`;
      
      const html = generateHTML();
      
      // Create form and submit
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = APPS_SCRIPT_URL;
      form.target = 'upload_iframe';
      form.style.display = 'none';
      
      const dataInput = document.createElement('input');
      dataInput.type = 'hidden';
      dataInput.name = 'data';
      dataInput.value = JSON.stringify({
        filename: filename,
        content: html,
        folderName: 'ASLS_Logs'
      });
      
      form.appendChild(dataInput);
      document.body.appendChild(form);
      
      const iframe = document.createElement('iframe');
      iframe.name = 'upload_iframe';
      iframe.style.display = 'none';
      document.body.appendChild(iframe);
      
      // Show message
      alert(`Uploading ${allLogs.length} logs to Drive...\n\nFilename: ${filename}\n\nCheck your Drive in the "ASLS_Logs" folder after a few seconds.`);
      
      form.submit();
      
      // Clean up after 5 seconds
      setTimeout(() => {
        document.body.removeChild(form);
        document.body.removeChild(iframe);
      }, 5000);
    }
    
    // Render table
    function renderTable() {
      const start = (currentPage - 1) * logsPerPage;
      const end = start + logsPerPage;
      const pageLogs = filteredLogs.slice(start, end);
      
      if (filteredLogs.length === 0) {
        document.getElementById('logsBody').innerHTML = '<tr><td colspan="10" style="text-align:center;">No logs found</td></tr>';
        return;
      }
      
      let html = '';
      pageLogs.forEach((log, idx) => {
        const actualIndex = start + idx;
        const date = new Date(log.timestamp);
        
        html += `<tr>
          <td>${date.toLocaleString()}</td>
          <td>${log.photo && log.photo !== 'no-photo' ? `<img src="${log.photo}" class="photo-thumb" onclick="viewPhoto('${log.photo}')">` : 'No photo'}</td>
          <td>${log.name}</td>
          <td>${log.lrn}</td>
          <td>${log.sex || 'N/A'}</td>
          <td>${log.grade || 'N/A'}</td>
          <td>${log.section || 'N/A'}</td>
          <td><span class="action-badge ${log.action === 'Log in' ? 'action-login' : 'action-logout'}">${log.action}</span></td>
          <td>✅ Verified</td>
          <td><button class="single-delete" onclick="confirmDelete(${actualIndex})">🗑️</button></td>
        </tr>`;
      });
      
      document.getElementById('logsBody').innerHTML = html;
    }
    
    // View photo
    function viewPhoto(src) {
      document.getElementById('modalImage').src = src;
      document.getElementById('photoModal').style.display = 'flex';
    }
    
    // Confirm delete
    function confirmDelete(index) {
      const log = filteredLogs[index];
      document.getElementById('confirmTitle').innerHTML = '⚠️ Delete Log';
      document.getElementById('confirmMessage').innerHTML = `Delete log for ${log.name}?`;
      document.getElementById('confirmYesBtn').onclick = () => executeDelete(index);
      document.getElementById('confirmModal').style.display = 'flex';
    }
    
    function confirmResetAll() {
      document.getElementById('confirmTitle').innerHTML = '⚠️ RESET ALL DATA';
      document.getElementById('confirmMessage').innerHTML = `Delete ALL ${allLogs.length} logs permanently?`;
      document.getElementById('confirmYesBtn').onclick = resetAllData;
      document.getElementById('confirmModal').style.display = 'flex';
    }
    
    function closeConfirmModal() {
      document.getElementById('confirmModal').style.display = 'none';
    }
    
    function executeDelete(index) {
      const logIndex = allLogs.findIndex(l => l.timestamp === filteredLogs[index].timestamp);
      if (logIndex !== -1) {
        allLogs.splice(logIndex, 1);
        localStorage.setItem('asls_master', JSON.stringify(allLogs));
        loadData();
      }
      closeConfirmModal();
    }
    
    function resetAllData() {
      localStorage.clear();
      closeConfirmModal();
      alert('All data reset. Page will reload.');
      window.location.reload();
    }
    
    // Initialize
    window.onload = loadData;
  </script>
</body>
</html>
