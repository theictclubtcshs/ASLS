<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASLS - Upload to Google Drive</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 30px;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    
    .header {
      background: white;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    
    .header h1 {
      color: #186E00;
      font-size: 2.5rem;
      font-weight: 800;
    }
    
    .header p {
      color: #666;
      margin-top: 5px;
    }
    
    .btn-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }
    
    .drive-btn {
      background: #4285F4;
      color: white;
      border: none;
      padding: 15px 40px;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .drive-btn:hover {
      background: #3367D6;
      transform: translateY(-3px);
    }
    
    .refresh-btn {
      background: #3498db;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 50px;
      font-size: 1.2rem;
      cursor: pointer;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
      margin-bottom: 30px;
    }
    
    .stat-card {
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    
    .stat-value {
      font-size: 2.5rem;
      font-weight: 800;
      color: #186E00;
    }
    
    .stat-label {
      color: #666;
      font-size: 0.9rem;
      text-transform: uppercase;
    }
    
    .drive-section {
      background: #4285F4;
      color: white;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
    }
    
    .drive-input-group {
      display: flex;
      gap: 15px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    
    .drive-input {
      flex: 1;
      min-width: 400px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
    }
    
    .test-btn {
      background: white;
      color: #4285F4;
      border: none;
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    
    .status-box {
      background: rgba(255,255,255,0.1);
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
    }
    
    .search-section {
      background: white;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 20px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }
    
    .search-box {
      flex: 1;
      min-width: 250px;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1rem;
    }
    
    .filter-select {
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1rem;
      min-width: 150px;
    }
    
    .logs-container {
      background: white;
      border-radius: 20px;
      padding: 20px;
      overflow-x: auto;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1300px;
    }
    
    th {
      background: #f8f9fa;
      padding: 15px 10px;
      text-align: left;
      border-bottom: 3px solid #186E00;
    }
    
    td {
      padding: 12px 10px;
      border-bottom: 1px solid #ecf0f1;
    }
    
    tr:hover {
      background: #f8f9fa;
    }
    
    .photo-thumb {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      object-fit: cover;
      cursor: pointer;
      border: 3px solid #186E00;
    }
    
    .action-badge {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: inline-block;
    }
    
    .action-login {
      background: #d4edda;
      color: #155724;
    }
    
    .action-logout {
      background: #f8d7da;
      color: #721c24;
    }
    
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    
    .modal-image {
      max-width: 90%;
      max-height: 90vh;
      border-radius: 10px;
    }
    
    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: white;
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
    }
    
    .pagination {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }
    
    .page-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
    }
    
    .page-btn.active {
      background: #186E00;
      color: white;
      border-color: #186E00;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>📊 ASLS Admin Panel</h1>
        <p>Upload student logs to Google Drive</p>
      </div>
      <div class="btn-group">
        <button class="refresh-btn" onclick="loadData()">🔄 Refresh</button>
      </div>
    </div>
    
    <div class="stats-grid" id="stats">
      <div class="stat-card">
        <div class="stat-label">Total Logs</div>
        <div class="stat-value" id="totalLogs">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Today's Logs</div>
        <div class="stat-value" id="todayLogs">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Storage Used</div>
        <div class="stat-value" id="storageUsed">0 MB</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Unique Students</div>
        <div class="stat-value" id="uniqueStudents">0</div>
      </div>
    </div>
    
    <div class="drive-section">
      <h2>☁️ Upload to Google Drive</h2>
      <div class="drive-input-group">
        <input type="text" id="scriptUrl" class="drive-input" 
               placeholder="Paste your Apps Script URL here"
               value="https://script.google.com/macros/s/AKfycbxYJvrOY7VuFSI0zozHPMWojzr3WfD-fom7zn9CG4lyQfLNSdXDnHXhNyZqUvHi1fiAPw/exec">
        <button class="test-btn" onclick="testConnection()">✓ Test</button>
        <button class="drive-btn" onclick="uploadToDrive()">☁️ UPLOAD TO DRIVE</button>
      </div>
      <div class="status-box" id="driveStatus">
        ⚡ Ready to upload. Click Test first, then Upload.
      </div>
    </div>
    
    <div class="search-section">
      <input type="text" class="search-box" id="searchInput" placeholder="🔍 Search..." onkeyup="filterLogs()">
      <select class="filter-select" id="actionFilter" onchange="filterLogs()">
        <option value="all">All Actions</option>
        <option value="Log in">Log In</option>
        <option value="Log out">Log Out</option>
      </select>
    </div>
    
    <div class="logs-container">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Photo</th>
            <th>Name</th>
            <th>LRN</th>
            <th>Sex</th>
            <th>Grade</th>
            <th>Section</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="logsBody">
          <tr><td colspan="8" style="text-align: center; padding: 50px;">Loading logs...</td></tr>
        </tbody>
      </table>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <!-- Photo Modal -->
  <div class="modal" id="photoModal" onclick="this.style.display='none'">
    <span class="modal-close" onclick="document.getElementById('photoModal').style.display='none'">✕</span>
    <img class="modal-image" id="modalImage" src="">
  </div>

  <script>
    // ============================================
    // ASLS - SINGLE FILE UPLOAD (FIXED)
    // ============================================
    
    let allLogs = [];
    let filteredLogs = [];
    let currentPage = 1;
    const logsPerPage = 50;
    let APPS_SCRIPT_URL = '';
    
    // Load data from localStorage
    function loadData() {
      try {
        allLogs = JSON.parse(localStorage.getItem('asls_master') || '[]');
        filteredLogs = [...allLogs];
        updateStats();
        filterLogs();
        
        // Load saved URL
        const savedUrl = localStorage.getItem('asls_script_url');
        if (savedUrl) {
          document.getElementById('scriptUrl').value = savedUrl;
          APPS_SCRIPT_URL = savedUrl;
        }
      } catch (e) {
        console.error('Error loading logs:', e);
      }
    }
    
    // Update statistics
    function updateStats() {
      const total = allLogs.length;
      const today = new Date().toISOString().split('T')[0];
      const todayLogs = allLogs.filter(l => l.timestamp.startsWith(today)).length;
      const size = new Blob([JSON.stringify(allLogs)]).size / (1024 * 1024);
      const uniqueStudents = new Set(allLogs.map(l => l.lrn)).size;
      
      document.getElementById('totalLogs').textContent = total;
      document.getElementById('todayLogs').textContent = todayLogs;
      document.getElementById('storageUsed').textContent = size.toFixed(2) + ' MB';
      document.getElementById('uniqueStudents').textContent = uniqueStudents;
    }
    
    // Filter logs
    function filterLogs() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const actionFilter = document.getElementById('actionFilter').value;
      
      filteredLogs = allLogs.filter(log => {
        if (searchTerm) {
          const matches = (log.name && log.name.toLowerCase().includes(searchTerm)) ||
                         (log.lrn && log.lrn.includes(searchTerm));
          if (!matches) return false;
        }
        if (actionFilter !== 'all' && log.action !== actionFilter) return false;
        return true;
      });
      
      filteredLogs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      currentPage = 1;
      renderTable();
    }
    
    // Render table
    function renderTable() {
      const start = (currentPage - 1) * logsPerPage;
      const end = start + logsPerPage;
      const pageLogs = filteredLogs.slice(start, end);
      
      if (filteredLogs.length === 0) {
        document.getElementById('logsBody').innerHTML = '<tr><td colspan="8" style="text-align:center;">No logs found</td></tr>';
        return;
      }
      
      let html = '';
      pageLogs.forEach((log) => {
        const date = new Date(log.timestamp);
        
        html += `<tr>
          <td>${date.toLocaleString()}</td>
          <td>${log.photo && log.photo !== 'no-photo' ? `<img src="${log.photo}" class="photo-thumb" onclick="viewPhoto('${log.photo}')">` : 'No photo'}</td>
          <td>${log.name}</td>
          <td>${log.lrn}</td>
          <td>${log.sex || 'N/A'}</td>
          <td>${log.grade || 'N/A'}</td>
          <td>${log.section || 'N/A'}</td>
          <td><span class="action-badge ${log.action === 'Log in' ? 'action-login' : 'action-logout'}">${log.action}</span></td>
        </tr>`;
      });
      
      document.getElementById('logsBody').innerHTML = html;
      renderPagination();
    }
    
    // Pagination
    function renderPagination() {
      const totalPages = Math.ceil(filteredLogs.length / logsPerPage);
      if (totalPages <= 1) {
        document.getElementById('pagination').innerHTML = '';
        return;
      }
      
      let html = '';
      for (let i = 1; i <= totalPages; i++) {
        html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
      }
      document.getElementById('pagination').innerHTML = html;
    }
    
    function goToPage(page) {
      currentPage = page;
      renderTable();
    }
    
    // View photo
    function viewPhoto(src) {
      document.getElementById('modalImage').src = src;
      document.getElementById('photoModal').style.display = 'flex';
    }
    
    // Test connection
    function testConnection() {
      const url = document.getElementById('scriptUrl').value.trim();
      const status = document.getElementById('driveStatus');
      
      if (!url) {
        status.innerHTML = '❌ Please enter a URL';
        return;
      }
      
      APPS_SCRIPT_URL = url;
      localStorage.setItem('asls_script_url', url);
      status.innerHTML = '✅ URL saved! Ready to upload.';
    }
    
    // Generate HTML file from logs
    function generateLogsHTML() {
      const now = new Date();
      
      let html = `<!DOCTYPE html>
<html>
<head>
  <title>ASLS Student Logs</title>
  <style>
    body { font-family: Arial; margin: 30px; background: #f5f5f5; }
    h1 { color: #186E00; border-bottom: 3px solid #186E00; padding-bottom: 10px; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; }
    th { background: #186E00; color: white; padding: 12px; text-align: left; }
    td { padding: 12px; border-bottom: 1px solid #ddd; }
    img { width: 100px; height: 100px; object-fit: cover; border-radius: 5px; border: 2px solid #186E00; }
    .login { background: #d4edda; color: #155724; padding: 5px 10px; border-radius: 20px; }
    .logout { background: #f8d7da; color: #721c24; padding: 5px 10px; border-radius: 20px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 20px 0; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; }
    .stat-value { font-size: 2rem; font-weight: bold; color: #186E00; }
  </style>
</head>
<body>
  <h1>📊 ASLS Student Logs</h1>
  <p>Generated: ${now.toLocaleString()}</p>
  
  <div class="stats">
    <div class="stat-card"><div class="stat-value">${allLogs.length}</div><div>Total Logs</div></div>
    <div class="stat-card"><div class="stat-value">${new Set(allLogs.map(l => l.lrn)).size}</div><div>Unique Students</div></div>
    <div class="stat-card"><div class="stat-value">${allLogs.filter(l => l.action === 'Log in').length}</div><div>Logins</div></div>
    <div class="stat-card"><div class="stat-value">${allLogs.filter(l => l.action === 'Log out').length}</div><div>Logouts</div></div>
  </div>
  
  <table>
    <tr>
      <th>Date/Time</th>
      <th>Photo</th>
      <th>Name</th>
      <th>LRN</th>
      <th>Sex</th>
      <th>Grade</th>
      <th>Section</th>
      <th>Action</th>
    </tr>`;
      
      allLogs.forEach(log => {
        const d = new Date(log.timestamp);
        html += `<tr>
          <td>${d.toLocaleString()}</td>
          <td>${log.photo && log.photo !== 'no-photo' ? `<img src="${log.photo}">` : 'No photo'}</td>
          <td>${log.name}</td>
          <td>${log.lrn}</td>
          <td>${log.sex || ''}</td>
          <td>${log.grade || ''}</td>
          <td>${log.section || ''}</td>
          <td><span class="${log.action === 'Log in' ? 'login' : 'logout'}">${log.action}</span></td>
        </tr>`;
      });
      
      html += `</table>
<p style="margin-top: 30px; color: #666;">Generated by ASLS Automated Student Log System</p>
</body>
</html>`;
      
      return html;
    }
    
    // Upload to Drive - SINGLE UPLOAD METHOD
    function uploadToDrive() {
      if (!APPS_SCRIPT_URL) {
        alert('Please test connection first');
        return;
      }
      
      if (allLogs.length === 0) {
        alert('No logs to upload');
        return;
      }
      
      const status = document.getElementById('driveStatus');
      status.innerHTML = '⏳ Generating HTML file...';
      
      // Generate filename with timestamp
      const now = new Date();
      const filename = `ASLS_Logs_${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}-${String(now.getMinutes()).padStart(2,'0')}.html`;
      
      // Generate HTML content
      const htmlContent = generateLogsHTML();
      
      status.innerHTML = '⏳ Uploading ' + allLogs.length + ' logs to Drive...';
      
      // Create a form to submit - THIS IS THE ONLY UPLOAD METHOD
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = APPS_SCRIPT_URL;
      form.target = 'upload_iframe';
      form.style.display = 'none';
      
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = 'data';
      input.value = JSON.stringify({
        filename: filename,
        content: htmlContent,
        folderName: 'AttendanceASLS'
      });
      
      form.appendChild(input);
      document.body.appendChild(form);
      
      const iframe = document.createElement('iframe');
      iframe.name = 'upload_iframe';
      iframe.style.display = 'none';
      document.body.appendChild(iframe);
      
      // Handle completion
      iframe.onload = function() {
        status.innerHTML = `✅ Upload complete!<br>
                           File: ${filename}<br>
                           Logs: ${allLogs.length}<br>
                           Folder: AttendanceASLS<br><br>
                           <strong>Check your Google Drive now!</strong>`;
        
        // Clean up
        setTimeout(() => {
          document.body.removeChild(form);
          document.body.removeChild(iframe);
        }, 1000);
      };
      
      form.submit();
    }
    
    // Initialize
    window.onload = loadData;
  </script>
</body>
</html>
