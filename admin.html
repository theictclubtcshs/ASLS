<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ASLS - Export</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, sans-serif;
    }
    
    body {
      background: #f0f2f5;
      padding: 40px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .header {
      background: #186E00;
      color: white;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .export-btn {
      background: white;
      color: #186E00;
      border: none;
      padding: 15px 40px;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .export-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .stat-card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    
    .stat-value {
      font-size: 2.5rem;
      font-weight: 700;
      color: #186E00;
    }
    
    .logs-table {
      background: white;
      border-radius: 15px;
      padding: 20px;
      overflow-x: auto;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
    }
    
    th {
      text-align: left;
      padding: 15px 10px;
      background: #f8f9fa;
      border-bottom: 3px solid #186E00;
    }
    
    td {
      padding: 12px 10px;
      border-bottom: 1px solid #e0e0e0;
    }
    
    .github-upload {
      margin-top: 30px;
      background: #24292e;
      color: white;
      padding: 30px;
      border-radius: 15px;
    }
    
    .github-upload input {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
    }
    
    .github-upload button {
      background: #2ea44f;
      color: white;
      border: none;
      padding: 15px 40px;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>📊 ASLS Admin Export</h1>
        <p>Export and upload logs to GitHub</p>
      </div>
      <button class="export-btn" onclick="exportAllLogs()">
        ⚡ EXPORT ALL
      </button>
    </div>
    
    <div class="stats" id="stats">
      <div class="stat-card">
        <div class="stat-value" id="totalLogs">0</div>
        <div>Total Logs</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="todayLogs">0</div>
        <div>Today</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="storageUsed">0 MB</div>
        <div>Storage Used</div>
      </div>
    </div>
    
    <div class="github-upload">
      <h2>📤 Upload to GitHub</h2>
      <p>Enter your GitHub token to upload all logs at once</p>
      <input type="password" id="githubToken" placeholder="GitHub Token (ghp_...)">
      <input type="text" id="repoPath" placeholder="Repository Path (e.g., username/repo)" value="theictclubtcshs/ASLS">
      <button onclick="uploadToGitHub()">Upload All Logs to GitHub</button>
    </div>
    
    <div class="logs-table">
      <h3>Recent Logs</h3>
      <table id="logsTable">
        <thead>
          <tr>
            <th>Time</th>
            <th>Name</th>
            <th>LRN</th>
            <th>Action</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="logsBody">
          <tr><td colspan="5">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    function loadStats() {
      const master = JSON.parse(localStorage.getItem('asls_master') || '[]');
      const today = new Date().toISOString().split('T')[0];
      const todayLogs = master.filter(l => l.timestamp.startsWith(today)).length;
      
      // Calculate size
      const size = new Blob([JSON.stringify(master)]).size / (1024 * 1024);
      
      document.getElementById('totalLogs').textContent = master.length;
      document.getElementById('todayLogs').textContent = todayLogs;
      document.getElementById('storageUsed').textContent = size.toFixed(2);
      
      // Show recent logs
      const recent = master.slice(-10).reverse();
      let html = '';
      recent.forEach(log => {
        html += `<tr>
          <td>${new Date(log.timestamp).toLocaleTimeString()}</td>
          <td>${log.name}</td>
          <td>${log.lrn}</td>
          <td>${log.action}</td>
          <td>✅</td>
        </tr>`;
      });
      document.getElementById('logsBody').innerHTML = html;
    }
    
    function exportAllLogs() {
      const master = JSON.parse(localStorage.getItem('asls_master') || '[]');
      
      // Group by date for organized export
      const byDate = {};
      master.forEach(log => {
        const date = log.timestamp.split('T')[0];
        if (!byDate[date]) byDate[date] = [];
        byDate[date].push(log);
      });
      
      // Export master file
      const masterBlob = new Blob([JSON.stringify(master, null, 2)], { type: 'application/json' });
      const masterUrl = URL.createObjectURL(masterBlob);
      
      const a = document.createElement('a');
      a.href = masterUrl;
      a.download = `asls_complete_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      
      // Also export daily files
      Object.keys(byDate).forEach(date => {
        const dailyBlob = new Blob([JSON.stringify(byDate[date], null, 2)], { type: 'application/json' });
        const dailyUrl = URL.createObjectURL(dailyBlob);
        
        const b = document.createElement('a');
        b.href = dailyUrl;
        b.download = `asls_${date}.json`;
        b.click();
        
        URL.revokeObjectURL(dailyUrl);
      });
      
      URL.revokeObjectURL(masterUrl);
    }
    
    async function uploadToGitHub() {
      const token = document.getElementById('githubToken').value;
      const repoPath = document.getElementById('repoPath').value;
      const [username, repo] = repoPath.split('/');
      
      if (!token || !username || !repo) {
        alert('Please enter token and repository path');
        return;
      }
      
      const master = JSON.parse(localStorage.getItem('asls_master') || '[]');
      
      // Group by date for organized upload
      const byDate = {};
      master.forEach(log => {
        const date = log.timestamp.split('T')[0];
        const period = new Date(log.timestamp).getHours() >= 12 ? 'PM' : 'AM';
        const path = `logs/${date.replace(/-/g, '/')}/${period}/logs.json`;
        
        if (!byDate[path]) byDate[path] = [];
        byDate[path].push(log);
      });
      
      let success = 0;
      let failed = 0;
      
      for (const [path, logs] of Object.entries(byDate)) {
        try {
          // Check if file exists
          let sha = null;
          try {
            const check = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${path}`);
            if (check.ok) {
              const data = await check.json();
              sha = data.sha;
            }
          } catch (e) {}
          
          // Upload
          const content = btoa(unescape(encodeURIComponent(JSON.stringify(logs, null, 2))));
          const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${path}`, {
            method: 'PUT',
            headers: {
              'Authorization': `token ${token}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              message: `Update logs for ${path}`,
              content: content,
              sha: sha,
              branch: 'main'
            })
          });
          
          if (response.ok) {
            success++;
          } else {
            failed++;
          }
        } catch (e) {
          failed++;
        }
      }
      
      alert(`Upload complete!\nSuccess: ${success}\nFailed: ${failed}`);
    }
    
    // Load on page load
    window.onload = loadStats;
    setInterval(loadStats, 5000);
  </script>
</body>
</html>
