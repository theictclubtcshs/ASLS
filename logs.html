<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASLS - Student Logs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: #186E00;
            color: white;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .header h2 {
            font-size: 1.2rem;
            font-weight: 400;
            opacity: 0.9;
            margin-top: 5px;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-box {
            background: white;
            border-radius: 50px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 300px;
        }

        .search-box input {
            border: none;
            outline: none;
            font-size: 1rem;
            width: 100%;
        }

        .search-box span {
            color: #666;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
        }

        .filter-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid transparent;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .filter-btn.active {
            background: white;
            color: #186E00;
            border-color: white;
        }

        .refresh-btn {
            background: white;
            color: #186E00;
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: #186E00;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .logs-container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1200px;
        }

        th {
            background: #f8f9fa;
            color: #2c3e50;
            font-weight: 600;
            padding: 15px 10px;
            text-align: left;
            border-bottom: 3px solid #186E00;
            position: sticky;
            top: 0;
            background: white;
        }

        td {
            padding: 15px 10px;
            border-bottom: 1px solid #ecf0f1;
            vertical-align: middle;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .action-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-align: center;
            display: inline-block;
            min-width: 80px;
        }

        .action-login {
            background: #d4edda;
            color: #155724;
        }

        .action-logout {
            background: #f8d7da;
            color: #721c24;
        }

        .photo-thumb {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.3s;
            border: 2px solid #186E00;
        }

        .photo-thumb:hover {
            transform: scale(3);
            z-index: 100;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .no-data {
            text-align: center;
            padding: 50px;
            color: #95a5a6;
            font-size: 1.2rem;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #186E00;
            font-size: 1.2rem;
        }

        .loading:after {
            content: '...';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }

        .export-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .export-btn:hover {
            background: #219a52;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>📋 Student Activity Logs</h1>
                <h2>Automated Student Log System - Tuguegarao City Science High School</h2>
            </div>
            <div class="controls">
                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" id="searchInput" placeholder="Search by name, LRN, grade, section...">
                </div>
                <div class="filter-buttons">
                    <button class="filter-btn active" onclick="filterLogs('all')">All</button>
                    <button class="filter-btn" onclick="filterLogs('Log in')">Logins</button>
                    <button class="filter-btn" onclick="filterLogs('Log out')">Logouts</button>
                </div>
                <button class="refresh-btn" onclick="loadLogs()">
                    <span>🔄</span> Refresh
                </button>
                <button class="export-btn" onclick="exportToCSV()">
                    <span>📥</span> Export CSV
                </button>
            </div>
        </div>

        <div class="stats-container" id="statsContainer">
            <div class="stat-card">
                <div class="stat-value" id="totalLogs">0</div>
                <div class="stat-label">Total Logs</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="todayLogs">0</div>
                <div class="stat-label">Today</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="loginCount">0</div>
                <div class="stat-label">Logins</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="logoutCount">0</div>
                <div class="stat-label">Logouts</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="uniqueStudents">0</div>
                <div class="stat-label">Unique Students</div>
            </div>
        </div>

        <div class="logs-container">
            <table id="logsTable">
                <thead>
                    <tr>
                        <th>Date & Time</th>
                        <th>LRN</th>
                        <th>Name</th>
                        <th>Sex</th>
                        <th>Grade</th>
                        <th>Section</th>
                        <th>Action</th>
                        <th>Status</th>
                        <th>Photo</th>
                    </tr>
                </thead>
                <tbody id="logsBody">
                    <tr>
                        <td colspan="9" class="loading">Loading logs</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const GITHUB_USERNAME = 'theictclubtcshs';
        const GITHUB_REPO = 'ASLS';
        const LOGS_JSON_URL = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/main/logs.json`;
        
        let allLogs = [];
        let filteredLogs = [];
        let currentFilter = 'all';

        async function loadLogs() {
            try {
                document.getElementById('logsBody').innerHTML = '<tr><td colspan="9" class="loading">Loading logs</td></tr>';
                
                const response = await fetch(LOGS_JSON_URL + '?t=' + Date.now());
                if (!response.ok) {
                    throw new Error('No logs found');
                }
                
                allLogs = await response.json();
                filteredLogs = [...allLogs];
                
                updateStats();
                renderTable();
            } catch (error) {
                document.getElementById('logsBody').innerHTML = `
                    <tr>
                        <td colspan="9" class="no-data">
                            📂 No logs found. Start logging students to see data here.
                        </td>
                    </tr>
                `;
                console.error('Error loading logs:', error);
            }
        }

        function updateStats() {
            const total = allLogs.length;
            const today = new Date().toDateString();
            const todayLogs = allLogs.filter(log => new Date(log.timestamp).toDateString() === today).length;
            const logins = allLogs.filter(log => log.action === 'Log in').length;
            const logouts = allLogs.filter(log => log.action === 'Log out').length;
            const uniqueStudents = new Set(allLogs.map(log => log.lrn)).size;

            document.getElementById('totalLogs').textContent = total;
            document.getElementById('todayLogs').textContent = todayLogs;
            document.getElementById('loginCount').textContent = logins;
            document.getElementById('logoutCount').textContent = logouts;
            document.getElementById('uniqueStudents').textContent = uniqueStudents;
        }

        function filterLogs(filter) {
            currentFilter = filter;
            
            // Update active button
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // Apply filter
            if (filter === 'all') {
                filteredLogs = [...allLogs];
            } else {
                filteredLogs = allLogs.filter(log => log.action === filter);
            }
            
            // Apply search if any
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            if (searchTerm) {
                filteredLogs = filteredLogs.filter(log => 
                    (log.name && log.name.toLowerCase().includes(searchTerm)) ||
                    (log.lrn && log.lrn.includes(searchTerm)) ||
                    (log.grade && log.grade.toLowerCase().includes(searchTerm)) ||
                    (log.section && log.section.toLowerCase().includes(searchTerm))
                );
            }
            
            renderTable();
        }

        function renderTable() {
            if (filteredLogs.length === 0) {
                document.getElementById('logsBody').innerHTML = `
                    <tr>
                        <td colspan="9" class="no-data">
                            📭 No logs match your filter
                        </td>
                    </tr>
                `;
                return;
            }

            let html = '';
            filteredLogs.forEach(log => {
                const date = new Date(log.timestamp);
                const formattedDate = date.toLocaleString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });

                html += `
                    <tr>
                        <td>${formattedDate}</td>
                        <td><strong>${log.lrn}</strong></td>
                        <td>${log.name}</td>
                        <td>${log.sex}</td>
                        <td>${log.grade}</td>
                        <td>${log.section}</td>
                        <td>
                            <span class="action-badge ${log.action === 'Log in' ? 'action-login' : 'action-logout'}">
                                ${log.action}
                            </span>
                        </td>
                        <td>${log.status || 'Verified'}</td>
                        <td>
                            ${log.photo ? 
                                `<img src="${log.photo}" class="photo-thumb" alt="Student photo" onclick="window.open(this.src)">` : 
                                'No photo'}
                        </td>
                    </tr>
                `;
            });

            document.getElementById('logsBody').innerHTML = html;
        }

        function exportToCSV() {
            // Create CSV headers
            const headers = ['Date', 'Time', 'LRN', 'Name', 'Sex', 'Grade', 'Section', 'Action', 'Status'];
            
            // Create CSV rows
            const rows = filteredLogs.map(log => {
                const date = new Date(log.timestamp);
                return [
                    date.toLocaleDateString(),
                    date.toLocaleTimeString(),
                    log.lrn,
                    log.name,
                    log.sex,
                    log.grade,
                    log.section,
                    log.action,
                    log.status || 'Verified'
                ];
            });
            
            // Combine headers and rows
            const csvContent = [headers, ...rows]
                .map(row => row.map(cell => `"${cell}"`).join(','))
                .join('\n');
            
            // Download CSV
            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `asls_logs_${new Date().toISOString().split('T')[0]}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            
            if (searchTerm) {
                filteredLogs = allLogs.filter(log => 
                    (log.name && log.name.toLowerCase().includes(searchTerm)) ||
                    (log.lrn && log.lrn.includes(searchTerm)) ||
                    (log.grade && log.grade.toLowerCase().includes(searchTerm)) ||
                    (log.section && log.section.toLowerCase().includes(searchTerm))
                );
            } else {
                filteredLogs = allLogs.filter(log => 
                    currentFilter === 'all' ? true : log.action === currentFilter
                );
            }
            
            renderTable();
        });

        // Auto refresh every 30 seconds
        setInterval(loadLogs, 30000);

        // Load on page load
        window.onload = loadLogs;
    </script>
</body>
</html>
