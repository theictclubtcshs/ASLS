<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASLS - Student Log System</title>
  <style>
    /* ===== FAST, MINIMAL CSS ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      height: 90vh;
      background: white;
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      display: flex;
      overflow: hidden;
    }

    .left-panel {
      flex: 1;
      background: #186E00;
      color: white;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .left-panel h1 {
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 20px;
    }

    .left-panel p {
      font-size: 1.2rem;
      opacity: 0.9;
      margin-bottom: 30px;
    }

    .stats {
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
    }

    .stat-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 1.1rem;
    }

    .right-panel {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
    }

    .camera-container {
      flex: 1;
      background: #1a1a1a;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 300px;
    }

    #video, #canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #canvas {
      display: none;
    }

    .camera-status {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f39c12;
      animation: pulse 1.5s infinite;
    }

    .status-dot.ready {
      background: #27ae60;
    }

    .status-dot.error {
      background: #e74c3c;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .camera-placeholder {
      color: white;
      text-align: center;
      padding: 20px;
    }

    .camera-placeholder button {
      background: #3498db;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 1rem;
      margin-top: 15px;
      cursor: pointer;
    }

    .input-area {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 15px;
    }

    .lrn-input {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .lrn-input input {
      flex: 1;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1.2rem;
      letter-spacing: 2px;
      font-weight: 600;
    }

    .lrn-input input:focus {
      outline: none;
      border-color: #186E00;
      box-shadow: 0 0 0 3px rgba(24,110,0,0.1);
    }

    .lrn-input input.error {
      border-color: #e74c3c;
    }

    .lrn-input button {
      padding: 15px 30px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lrn-input button:hover:not(:disabled) {
      background: #2980b9;
    }

    .lrn-input button:disabled {
      background: #bdc3c7;
      cursor: not-allowed;
    }

    .preview {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .preview img {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      object-fit: cover;
      border: 3px solid #186E00;
    }

    .action-btn {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .action-btn.login {
      background: #27ae60;
      color: white;
    }

    .action-btn.logout {
      background: #e74c3c;
      color: white;
    }

    .action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .overlay-content {
      text-align: center;
      color: white;
      padding: 40px;
    }

    .overlay-content h2 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    .overlay-content .success {
      color: #27ae60;
    }

    .overlay-content .error {
      color: #e74c3c;
    }
  </style>
  
  <!-- Load student data from separate file -->
  <script src="students.js"></script>
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <h1>ASLS<br>Student Log</h1>
      <p>Automated Student Log System</p>
      <div class="stats">
        <div class="stat-item">
          <span>📊 Today's Logs:</span>
          <span id="todayCount">0</span>
        </div>
        <div class="stat-item">
          <span>👥 Students:</span>
          <span id="studentCount">0</span>
        </div>
        <div class="stat-item">
          <span>💾 Local Logs:</span>
          <span id="cacheSize">0</span>
        </div>
      </div>
    </div>
    
    <div class="right-panel">
      <div class="camera-container" id="cameraContainer">
        <video id="video" autoplay playsinline style="display: none;"></video>
        <canvas id="canvas"></canvas>
        <div class="camera-placeholder" id="cameraPlaceholder" style="display: flex; flex-direction: column; align-items: center;">
          <div style="font-size: 48px; margin-bottom: 20px;">📷</div>
          <h3 style="color: white; margin-bottom: 10px;">Camera Initializing...</h3>
          <p style="color: #aaa; margin-bottom: 20px;">Please grant camera permission when prompted</p>
          <button onclick="requestCameraPermission()" id="requestBtn" style="display: none;">Allow Camera Access</button>
        </div>
        <div class="camera-status">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Initializing...</span>
        </div>
      </div>
      
      <div class="input-area">
        <div class="lrn-input">
          <input type="text" 
                 id="lrn" 
                 placeholder="12-digit LRN" 
                 maxlength="12"
                 inputmode="numeric"
                 autocomplete="off"
                 disabled>
          <button onclick="handleCapture()" id="captureBtn" disabled>CAPTURE</button>
        </div>
        
        <div class="preview" id="previewArea" style="display: none;">
          <img id="previewImage" src="" alt="Preview">
          <button class="action-btn" id="actionBtn" onclick="applyLog()" disabled>LOG IN</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Overlays -->
  <div class="overlay" id="successOverlay">
    <div class="overlay-content">
      <h2 class="success">✅ SUCCESS</h2>
      <p id="successMessage"></p>
    </div>
  </div>

  <div class="overlay" id="errorOverlay">
    <div class="overlay-content">
      <h2 class="error">❌ ERROR</h2>
      <p id="errorMessage"></p>
    </div>
  </div>

  <script>
    // ============================================
    // ASLS MAIN CAMERA PAGE - FIXED CAMERA INIT
    // ============================================
    
    // Student data is loaded from students.js
    console.log(`✅ Loaded ${STUDENTS_DATA.length} students`);
    
    // Create fast lookup map
    const studentMap = new Map();
    STUDENTS_DATA.forEach(s => studentMap.set(s.lrn, s));
    
    // DOM Elements
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const cameraPlaceholder = document.getElementById('cameraPlaceholder');
    const requestBtn = document.getElementById('requestBtn');
    let currentStream = null;
    let capturedImage = null;
    let isProcessing = false;
    let cameraActive = false;
    
    const lrnInput = document.getElementById('lrn');
    const captureBtn = document.getElementById('captureBtn');
    const previewArea = document.getElementById('previewArea');
    const previewImage = document.getElementById('previewImage');
    const actionBtn = document.getElementById('actionBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    
    const successOverlay = document.getElementById('successOverlay');
    const errorOverlay = document.getElementById('errorOverlay');
    
    // Get action from URL
    const urlParams = new URLSearchParams(window.location.search);
    let action = urlParams.get('action') || 'Log in';
    actionBtn.textContent = action;
    actionBtn.className = `action-btn ${action === 'Log in' ? 'login' : 'logout'}`;
    
    // Update student count
    document.getElementById('studentCount').textContent = STUDENTS_DATA.length;
    
    // ========== FAST STUDENT LOOKUP ==========
    function findStudent(lrn) {
      return studentMap.get(lrn);
    }
    
    // ========== LOCAL STORAGE FUNCTIONS ==========
    function getTodayPath() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const period = now.getHours() >= 12 ? 'PM' : 'AM';
      return `${year}-${month}-${day}-${period}`;
    }
    
    function saveLogLocally(logEntry) {
      try {
        // Master log
        let masterLog = JSON.parse(localStorage.getItem('asls_master') || '[]');
        masterLog.push(logEntry);
        if (masterLog.length > 10000) masterLog = masterLog.slice(-10000);
        localStorage.setItem('asls_master', JSON.stringify(masterLog));
        
        // Daily log
        const today = getTodayPath();
        let dailyLog = JSON.parse(localStorage.getItem(`asls_${today}`) || '[]');
        dailyLog.push(logEntry);
        localStorage.setItem(`asls_${today}`, JSON.stringify(dailyLog));
        
        updateStats();
        return true;
      } catch (e) {
        console.error('Error saving to localStorage:', e);
        return false;
      }
    }
    
    function updateStats() {
      const master = JSON.parse(localStorage.getItem('asls_master') || '[]');
      const today = getTodayPath();
      const daily = JSON.parse(localStorage.getItem(`asls_${today}`) || '[]');
      
      document.getElementById('todayCount').textContent = daily.length;
      document.getElementById('cacheSize').textContent = master.length + ' logs';
    }
    
    // ========== FIXED CAMERA FUNCTIONS ==========
    async function requestCameraPermission() {
      updateCameraStatus('waiting', 'Requesting camera...');
      requestBtn.style.display = 'none';
      
      try {
        // Check if browser supports getUserMedia
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('Your browser does not support camera access');
        }
        
        // Request camera with specific constraints
        const constraints = {
          video: {
            facingMode: 'user',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        };
        
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        
        // Attach stream to video element
        video.srcObject = currentStream;
        
        // Wait for video to be ready
        await new Promise((resolve) => {
          video.onloadedmetadata = () => {
            video.play();
            resolve();
          };
        });
        
        // Success!
        video.style.display = 'block';
        cameraPlaceholder.style.display = 'none';
        cameraActive = true;
        
        updateCameraStatus('ready', 'Camera Ready');
        lrnInput.disabled = false;
        captureBtn.disabled = false;
        lrnInput.focus();
        
        console.log('✅ Camera initialized successfully');
        
      } catch (error) {
        console.error('Camera error:', error);
        
        // Handle specific errors
        if (error.name === 'NotAllowedError' || error.message.includes('permission')) {
          updateCameraStatus('error', 'Camera permission denied');
          cameraPlaceholder.innerHTML = `
            <div style="font-size: 48px; margin-bottom: 20px;">🚫</div>
            <h3 style="color: white; margin-bottom: 10px;">Camera Access Denied</h3>
            <p style="color: #aaa; margin-bottom: 20px;">Please allow camera access in your browser settings</p>
            <button onclick="requestCameraPermission()" style="background: #3498db; color: white; border: none; padding: 12px 24px; border-radius: 30px; cursor: pointer;">Try Again</button>
          `;
        } else if (error.name === 'NotFoundError') {
          updateCameraStatus('error', 'No camera found');
          cameraPlaceholder.innerHTML = `
            <div style="font-size: 48px; margin-bottom: 20px;">📵</div>
            <h3 style="color: white; margin-bottom: 10px;">No Camera Detected</h3>
            <p style="color: #aaa;">Please connect a camera to continue</p>
          `;
        } else {
          updateCameraStatus('error', 'Camera error');
          cameraPlaceholder.innerHTML = `
            <div style="font-size: 48px; margin-bottom: 20px;">❌</div>
            <h3 style="color: white; margin-bottom: 10px;">Camera Error</h3>
            <p style="color: #aaa; margin-bottom: 20px;">${error.message}</p>
            <button onclick="requestCameraPermission()" style="background: #3498db; color: white; border: none; padding: 12px 24px; border-radius: 30px; cursor: pointer;">Try Again</button>
          `;
        }
      }
    }
    
    function updateCameraStatus(status, text) {
      statusText.textContent = text;
      statusDot.className = 'status-dot';
      
      if (status === 'ready') {
        statusDot.classList.add('ready');
      } else if (status === 'error') {
        statusDot.classList.add('error');
      }
    }
    
    function handleCapture() {
      if (!cameraActive || isProcessing) return;
      
      const lrn = lrnInput.value.trim();
      if (!lrn || lrn.length !== 12 || !/^\d+$/.test(lrn)) {
        showError('Enter valid 12-digit LRN');
        lrnInput.classList.add('error');
        return;
      }
      
      const student = findStudent(lrn);
      if (!student) {
        showError('Student not found in database');
        lrnInput.classList.add('error');
        return;
      }
      
      lrnInput.classList.remove('error');
      captureImage();
    }
    
    function captureImage() {
      isProcessing = true;
      captureBtn.disabled = true;
      lrnInput.disabled = true;
      
      // Set canvas dimensions
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      
      // Draw video frame to canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // Capture image
      capturedImage = canvas.toDataURL('image/jpeg', 0.6);
      
      // Show preview
      previewImage.src = capturedImage;
      previewArea.style.display = 'flex';
      video.style.display = 'none';
      canvas.style.display = 'block';
      
      updateCameraStatus('ready', 'Photo Captured');
      actionBtn.disabled = false;
      
      // Auto-apply after short delay
      setTimeout(() => {
        if (!isProcessing) return;
        applyLog();
      }, 200);
    }
    
    function resetCamera() {
      isProcessing = false;
      captureBtn.disabled = false;
      lrnInput.disabled = false;
      actionBtn.disabled = true;
      previewArea.style.display = 'none';
      capturedImage = null;
      
      // Show video again
      video.style.display = 'block';
      canvas.style.display = 'none';
      
      if (cameraActive) {
        updateCameraStatus('ready', 'Camera Ready');
      }
      
      lrnInput.focus();
    }
    
    async function applyLog() {
      const lrn = lrnInput.value.trim();
      const student = findStudent(lrn);
      
      if (!student) {
        showError('Student not found');
        resetCamera();
        return;
      }
      
      const now = new Date();
      const logEntry = {
        timestamp: now.toISOString(),
        time: now.toLocaleTimeString(),
        date: now.toLocaleDateString(),
        period: now.getHours() >= 12 ? 'PM' : 'AM',
        lrn: lrn,
        name: student.name,
        sex: student.sex || 'N/A',
        grade: student.grade || 'N/A',
        section: student.section || 'N/A',
        action: action,
        photo: capturedImage || 'no-photo',
        status: 'verified'
      };
      
      const saved = saveLogLocally(logEntry);
      
      if (saved) {
        showSuccess(`${student.name} ${action} successful!`);
      } else {
        showError('Failed to save log');
      }
      
      resetCamera();
      lrnInput.value = '';
    }
    
    function showSuccess(msg) {
      document.getElementById('successMessage').textContent = msg;
      successOverlay.style.display = 'flex';
      setTimeout(() => {
        successOverlay.style.display = 'none';
      }, 1500);
    }
    
    function showError(msg) {
      document.getElementById('errorMessage').textContent = msg;
      errorOverlay.style.display = 'flex';
      setTimeout(() => {
        errorOverlay.style.display = 'none';
      }, 1500);
    }
    
    // ========== EVENT LISTENERS ==========
    lrnInput.addEventListener('input', function(e) {
      this.value = this.value.replace(/[^0-9]/g, '').slice(0, 12);
      if (this.value.length === 12 && !isProcessing && cameraActive) {
        handleCapture();
      }
    });
    
    lrnInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleCapture();
      }
    });
    
    // ========== INIT ==========
    window.onload = function() {
      updateStats();
      
      // Auto-request camera on page load
      setTimeout(() => {
        requestCameraPermission();
      }, 500);
      
      setInterval(updateStats, 1000);
    };
    
    window.onbeforeunload = function() {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
      }
    };
    
    // Expose functions
    window.handleCapture = handleCapture;
    window.applyLog = applyLog;
    window.requestCameraPermission = requestCameraPermission;
  </script>
</body>
</html>
