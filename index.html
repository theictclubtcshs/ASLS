<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASLS - VERSION 2.0 2026</title>
  <style>
    /* COMPACT, FAST-LOADING CSS */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      height: 90vh;
      background: white;
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      display: flex;
      overflow: hidden;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .left-panel {
      flex: 1;
      color: white;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: background-color 0.3s ease;
    }

    .left-panel.login-bg {
      background: #186E00 !important;
    }

    .left-panel.logout-bg {
      background: #c0392b !important;
    }

    .left-panel h1 {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .left-panel .mode-message {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      animation: pulseText 2s infinite;
    }

    @keyframes pulseText {
      0% { opacity: 1; }
      50% { opacity: 0.9; }
      100% { opacity: 1; }
    }

    .left-panel p {
      font-size: 1.2rem;
      opacity: 0.9;
      margin-bottom: 30px;
    }

    .stats {
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
    }

    .stat-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 1.1rem;
    }

    .right-panel {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
    }

    .camera-container {
      flex: 1;
      background: #f0f0f0;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      margin-bottom: 20px;
    }

    #video, #canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #canvas {
      display: none;
    }

    .camera-status {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f39c12;
      animation: pulse 1.5s infinite;
    }

    .status-dot.ready {
      background: #27ae60;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .input-area {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 15px;
    }

    .lrn-input {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .lrn-input input {
      flex: 1;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1.2rem;
      letter-spacing: 2px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .lrn-input input:focus {
      outline: none;
      border-color: #186E00;
      box-shadow: 0 0 0 3px rgba(24,110,0,0.1);
    }

    .lrn-input input.error {
      border-color: #e74c3c;
    }

    .lrn-input input:disabled {
      background: #e0e0e0;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .lrn-input button {
      padding: 15px 30px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .lrn-input button:hover:not(:disabled) {
      background: #2980b9;
      transform: translateY(-2px);
    }

    .lrn-input button:disabled {
      background: #bdc3c7;
      cursor: not-allowed;
    }

    .preview {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .preview img {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      object-fit: cover;
      border: 3px solid #186E00;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      flex: 1;
    }

    .action-btn {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
    }

    .action-btn.login {
      background: #27ae60;
      color: white;
    }

    .action-btn.logout {
      background: #e74c3c;
      color: white;
    }

    .action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .quick-stats {
      margin-top: 15px;
      display: flex;
      justify-content: space-between;
      color: #666;
      font-size: 0.9rem;
    }

    .mode-indicator {
      margin-top: 15px;
      padding: 10px;
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.95rem;
      backdrop-filter: blur(5px);
    }

    .mode-badge {
      padding: 5px 15px;
      border-radius: 20px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .mode-badge.login {
      background: #27ae60;
      color: white;
    }

    .mode-badge.logout {
      background: #e74c3c;
      color: white;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .overlay-content {
      text-align: center;
      color: white;
      padding: 40px;
    }

    .overlay-content h2 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    .overlay-content .success {
      color: #27ae60;
    }

    .overlay-content .error {
      color: #e74c3c;
    }

    .fs-notification {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #186E00;
      color: white;
      padding: 20px 40px;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: bold;
      z-index: 2000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      animation: slideDown 0.5s ease-out;
    }

    .fs-notification.warning {
      background: #e67e22;
    }

    @keyframes slideDown {
      from { top: -100px; opacity: 0; }
      to { top: 20px; opacity: 1; }
    }

    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      background: rgba(255,255,255,0.3);
      border-radius: 5px;
      margin-top: 15px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: white;
      width: 0%;
      transition: width 0.3s;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .left-panel {
        padding: 20px;
      }
      .left-panel h1 {
        font-size: 2rem;
      }
      .left-panel .mode-message {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left-panel" id="leftPanel">
      <h1>ASLS 2.0</h1>
      <div class="mode-message" id="modeMessage">YOU ARE LOGGING IN</div>
      <p>Automated Student Log System</p>
      <div class="stats">
        <div class="stat-item">
          <span>📊 Today's Logs:</span>
          <span id="todayCount">0</span>
        </div>
        <div class="stat-item">
          <span>⏱️ Response Time:</span>
          <span id="responseTime">&lt;100ms</span>
        </div>
        <div class="stat-item">
          <span>💾 Local Cache:</span>
          <span id="cacheSize">0 logs</span>
        </div>
      </div>
      <div class="mode-indicator">
        <span>Current Mode:</span>
        <span class="mode-badge" id="modeBadge">LOG IN</span>
      </div>
    </div>
    
    <div class="right-panel">
      <div class="camera-container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
        <div class="camera-status">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Initializing...</span>
        </div>
      </div>
      
      <div class="input-area">
        <div class="lrn-input">
          <input type="text" 
                 id="lrn" 
                 placeholder="12-digit LRN" 
                 maxlength="12"
                 inputmode="numeric"
                 autocomplete="off">
          <button onclick="handleCapture()" id="captureBtn">CAPTURE</button>
        </div>
        
        <div class="preview" id="previewArea" style="display: none;">
          <img id="previewImage" src="" alt="Preview">
          <div class="action-buttons">
            <button class="action-btn" id="actionBtn" onclick="applyLog()">LOG IN</button>
          </div>
        </div>
        
        <div class="quick-stats">
          <span>📷 Camera Ready</span>
          <span>⚡ Instant Save</span>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay" id="successOverlay">
    <div class="overlay-content">
      <h2 class="success" id="successTitle">✅ SUCCESS</h2>
      <p id="successMessage"></p>
    </div>
  </div>

  <div class="overlay" id="errorOverlay">
    <div class="overlay-content">
      <h2 class="error" id="errorTitle">❌ ERROR</h2>
      <p id="errorMessage"></p>
    </div>
  </div>

  <!-- LOAD STUDENT DATABASE FROM EXTERNAL FILE -->
  <script src="students.js"></script>
  
  <script>
    // ============================================
    // ULTRA-FAST LOCAL STORAGE SYSTEM
    // ============================================
    
    // STUDENTS_DATA is now loaded from external file!
    // Just make sure it exists, if not, use empty array
    if (typeof STUDENTS_DATA === 'undefined') {
      console.error('STUDENTS_DATA not found! Make sure students.js is loaded properly.');
      var STUDENTS_DATA = []; // Fallback empty array
    }
    
    // Fast lookup using Map (O(1) constant time)
    const studentMap = new Map();
    STUDENTS_DATA.forEach(s => studentMap.set(s.lrn, s));
    console.log(`✅ Loaded ${STUDENTS_DATA.length} students from external file`);
    
    // DOM Elements
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let currentStream = null;
    let capturedImage = null;
    let isProcessing = false;
    let isFreshStarting = false;
    
    const lrnInput = document.getElementById('lrn');
    const captureBtn = document.getElementById('captureBtn');
    const previewArea = document.getElementById('previewArea');
    const previewImage = document.getElementById('previewImage');
    const actionBtn = document.getElementById('actionBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const modeBadge = document.getElementById('modeBadge');
    const modeMessage = document.getElementById('modeMessage');
    const leftPanel = document.getElementById('leftPanel');
    
    const successOverlay = document.getElementById('successOverlay');
    const errorOverlay = document.getElementById('errorOverlay');
    
    // Get action from URL
    const urlParams = new URLSearchParams(window.location.search);
    let action = urlParams.get('action') || 'Log in';
    
    // ============================================
    // AUTO FRESH START DETECTION
    // ============================================
    
    function checkLogCountAndTriggerFreshStart() {
      try {
        const logs = JSON.parse(localStorage.getItem('asls_master') || '[]');
        const logCount = logs.length;
        
        console.log(`Current log count: ${logCount}/40`);
        
        if (logCount >= 40 && !isFreshStarting) {
          console.log('🎯 Reached 40 logs! Triggering Fresh Start...');
          triggerFreshStart(logs);
        }
      } catch (e) {
        console.error('Error checking log count:', e);
      }
    }
    
    function triggerFreshStart(logs) {
      isFreshStarting = true;
      
      lrnInput.disabled = true;
      captureBtn.disabled = true;
      if (actionBtn) actionBtn.disabled = true;
      
      const notification = document.createElement('div');
      notification.className = 'fs-notification warning';
      notification.innerHTML = `
        <div>🔄 SYSTEM REACHED 40 LOGS!</div>
        <div style="font-size: 1rem; margin-top: 10px;">Auto-saving to Google Drive...</div>
        <div class="progress-bar">
          <div class="progress-fill" id="fsProgress"></div>
        </div>
        <div style="font-size: 0.9rem; margin-top: 10px;" id="fsStatus">Preparing...</div>
      `;
      document.body.appendChild(notification);
      
      const progressFill = document.getElementById('fsProgress');
      const fsStatus = document.getElementById('fsStatus');
      
      fsStatus.textContent = 'Uploading to Google Drive...';
      progressFill.style.width = '30%';
      
      uploadLogsToDrive(logs)
        .then(() => {
          fsStatus.textContent = 'Upload complete! Clearing local data...';
          progressFill.style.width = '70%';
          
          clearAllLogs();
          
          fsStatus.textContent = 'Fresh Start complete! Resuming in 3 seconds...';
          progressFill.style.width = '100%';
          
          setTimeout(() => {
            notification.style.animation = 'fadeOut 0.5s ease-out';
            setTimeout(() => {
              document.body.removeChild(notification);
              
              isFreshStarting = false;
              lrnInput.disabled = false;
              captureBtn.disabled = false;
              lrnInput.focus();
              
              updateStats();
              
            }, 500);
          }, 3000);
        })
        .catch(error => {
          console.error('Fresh Start upload error:', error);
          fsStatus.textContent = 'Upload failed - continuing anyway...';
          progressFill.style.width = '100%';
          progressFill.style.background = '#e74c3c';
          
          clearAllLogs();
          
          setTimeout(() => {
            notification.style.animation = 'fadeOut 0.5s ease-out';
            setTimeout(() => {
              document.body.removeChild(notification);
              isFreshStarting = false;
              lrnInput.disabled = false;
              captureBtn.disabled = false;
              lrnInput.focus();
              updateStats();
            }, 500);
          }, 3000);
        });
    }
    
    function uploadLogsToDrive(logs) {
      return new Promise((resolve, reject) => {
        const APPS_SCRIPT_URL = localStorage.getItem('asls_script_url') || 
          'https://script.google.com/macros/s/AKfycbxYJvrOY7VuFSI0zozHPMWojzr3WfD-fom7zn9CG4lyQfLNSdXDnHXhNyZqUvHi1fiAPw/exec';
        
        if (!APPS_SCRIPT_URL || logs.length === 0) {
          resolve(0);
          return;
        }
        
        const now = new Date();
        const filename = `ASLS_Backup_${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}-${String(now.getMinutes()).padStart(2,'0')}.html`;
        
        const htmlContent = generateLogsHTML(logs);
        
        const iframe = document.createElement('iframe');
        iframe.name = 'fs_upload_iframe';
        iframe.style.display = 'none';
        document.body.appendChild(iframe);
        
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = APPS_SCRIPT_URL;
        form.target = 'fs_upload_iframe';
        form.style.display = 'none';
        
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'data';
        input.value = JSON.stringify({
          filename: filename,
          content: htmlContent,
          folderName: 'AttendanceASLS'
        });
        
        form.appendChild(input);
        document.body.appendChild(form);
        
        let completed = false;
        
        iframe.onload = function() {
          if (!completed) {
            completed = true;
            setTimeout(() => {
              document.body.removeChild(form);
              document.body.removeChild(iframe);
            }, 1000);
            resolve(logs.length);
          }
        };
        
        iframe.onerror = function() {
          if (!completed) {
            completed = true;
            document.body.removeChild(form);
            document.body.removeChild(iframe);
            reject(new Error('Upload failed'));
          }
        };
        
        setTimeout(() => {
          if (!completed) {
            completed = true;
            document.body.removeChild(form);
            document.body.removeChild(iframe);
            resolve(logs.length);
          }
        }, 8000);
        
        form.submit();
      });
    }
    
    function generateLogsHTML(logs) {
      const now = new Date();
      
      let html = `<!DOCTYPE html>
<html>
<head>
  <title>ASLS Logs Backup - ${now.toLocaleDateString()}</title>
  <style>
    body { font-family: Arial; margin: 30px; background: #f5f5f5; }
    h1 { color: #186E00; border-bottom: 3px solid #186E00; padding-bottom: 10px; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; }
    th { background: #186E00; color: white; padding: 12px; text-align: left; }
    td { padding: 12px; border-bottom: 1px solid #ddd; }
    img { width: 100px; height: 100px; object-fit: cover; border-radius: 5px; border: 2px solid #186E00; }
    .login { background: #d4edda; color: #155724; padding: 5px 10px; border-radius: 20px; }
    .logout { background: #f8d7da; color: #721c24; padding: 5px 10px; border-radius: 20px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 20px 0; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; }
    .stat-value { font-size: 2rem; font-weight: bold; color: #186E00; }
  </style>
</head>
<body>
  <h1>📊 ASLS Logs Backup</h1>
  <p>Generated: ${now.toLocaleString()}</p>
  <p><strong>Reason:</strong> Auto Fresh Start - 40 Logs Reached</p>
  
  <div class="stats">
    <div class="stat-card"><div class="stat-value">${logs.length}</div><div>Total Logs</div></div>
    <div class="stat-card"><div class="stat-value">${new Set(logs.map(l => l.lrn)).size}</div><div>Unique Students</div></div>
    <div class="stat-card"><div class="stat-value">${logs.filter(l => l.action === 'Log in').length}</div><div>Logins</div></div>
    <div class="stat-card"><div class="stat-value">${logs.filter(l => l.action === 'Log out').length}</div><div>Logouts</div></div>
  </div>
  
  <table>
    <tr>
      <th>Date/Time</th>
      <th>Photo</th>
      <th>Name</th>
      <th>LRN</th>
      <th>Sex</th>
      <th>Grade</th>
      <th>Section</th>
      <th>Action</th>
    </tr>`;
      
      logs.forEach(log => {
        const d = new Date(log.timestamp);
        html += `<tr>
          <td>${d.toLocaleString()}</td>
          <td>${log.photo && log.photo !== 'no-photo' ? `<img src="${log.photo}">` : 'No photo'}</td>
          <td>${log.name}</td>
          <td>${log.lrn}</td>
          <td>${log.sex || ''}</td>
          <td>${log.grade || ''}</td>
          <td>${log.section || ''}</td>
          <td><span class="${log.action === 'Log in' ? 'login' : 'logout'}">${log.action}</span></td>
        </tr>`;
      });
      
      html += `</table>
<p style="margin-top: 30px; color: #666;">Generated by ASLS Auto Fresh Start</p>
</body>
</html>`;
      
      return html;
    }
    
    function clearAllLogs() {
      localStorage.removeItem('asls_master');
      
      const keys = Object.keys(localStorage);
      keys.forEach(key => {
        if (key.startsWith('asls_')) {
          localStorage.removeItem(key);
        }
      });
    }
    
    // ============================================
    // UPDATE UI BASED ON ACTION
    // ============================================
    
    function updateActionUI() {
      actionBtn.textContent = action;
      modeBadge.textContent = action;
      
      if (action === 'Log in') {
        modeMessage.textContent = 'YOU ARE LOGGING IN';
      } else {
        modeMessage.textContent = 'YOU ARE LOGGING OUT';
      }
      
      leftPanel.classList.remove('login-bg', 'logout-bg');
      
      if (action === 'Log in') {
        actionBtn.className = 'action-btn login';
        modeBadge.className = 'mode-badge login';
        leftPanel.classList.add('login-bg');
        leftPanel.style.backgroundColor = '#186E00';
      } else {
        actionBtn.className = 'action-btn logout';
        modeBadge.className = 'mode-badge logout';
        leftPanel.classList.add('logout-bg');
        leftPanel.style.backgroundColor = '#c0392b';
      }
    }
    
    updateActionUI();
    
    // ========== FAST LOCAL STORAGE ==========
    
    function getTodayPath() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const period = now.getHours() >= 12 ? 'PM' : 'AM';
      return `${year}-${month}-${day}-${period}`;
    }
    
    function saveLogLocally(logEntry) {
      if (isFreshStarting) return false;
      
      const start = performance.now();
      
      let masterLog = JSON.parse(localStorage.getItem('asls_master') || '[]');
      masterLog.push(logEntry);
      if (masterLog.length > 10000) masterLog = masterLog.slice(-10000);
      localStorage.setItem('asls_master', JSON.stringify(masterLog));
      
      const today = getTodayPath();
      let dailyLog = JSON.parse(localStorage.getItem(`asls_${today}`) || '[]');
      dailyLog.push(logEntry);
      localStorage.setItem(`asls_${today}`, JSON.stringify(dailyLog));
      
      updateStats();
      checkLogCountAndTriggerFreshStart();
      
      const end = performance.now();
      console.log(`✅ Saved in ${(end - start).toFixed(2)}ms`);
      return true;
    }
    
    function updateStats() {
      const master = JSON.parse(localStorage.getItem('asls_master') || '[]');
      const today = getTodayPath();
      const daily = JSON.parse(localStorage.getItem(`asls_${today}`) || '[]');
      
      document.getElementById('todayCount').textContent = daily.length;
      document.getElementById('cacheSize').textContent = master.length + ' logs';
    }
    
    function findStudent(lrn) {
      return studentMap.get(lrn);
    }
    
    // ========== CAMERA FUNCTIONS ==========
    
    async function initCamera() {
      try {
        statusText.textContent = 'Requesting camera...';
        
        if (currentStream) {
          currentStream.getTracks().forEach(t => t.stop());
        }
        
        currentStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'user' },
          audio: false 
        });
        
        video.srcObject = currentStream;
        await video.play();
        
        statusDot.className = 'status-dot ready';
        statusText.textContent = 'Ready';
        captureBtn.disabled = false;
        
      } catch (error) {
        statusText.textContent = 'Camera error';
        captureBtn.disabled = true;
      }
    }
    
    function handleCapture() {
      if (isProcessing || isFreshStarting) return;
      
      const lrn = lrnInput.value.trim();
      if (!lrn || lrn.length !== 12 || !/^\d+$/.test(lrn)) {
        showError('Enter valid 12-digit LRN');
        lrnInput.classList.add('error');
        return;
      }
      
      const student = findStudent(lrn);
      if (!student) {
        showError('Student not found');
        lrnInput.classList.add('error');
        return;
      }
      
      lrnInput.classList.remove('error');
      captureImage();
    }
    
    function captureImage() {
      isProcessing = true;
      captureBtn.disabled = true;
      lrnInput.disabled = true;
      
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      capturedImage = canvas.toDataURL('image/jpeg', 0.6);
      
      previewImage.src = capturedImage;
      previewArea.style.display = 'flex';
      actionBtn.disabled = false;
      
      setTimeout(() => {
        if (!isProcessing || isFreshStarting) return;
        applyLog();
      }, 200);
    }
    
    async function applyLog() {
      if (isFreshStarting) return;
      
      const lrn = lrnInput.value.trim();
      const student = findStudent(lrn);
      
      if (!student) {
        showError('Student not found');
        resetCamera();
        return;
      }
      
      const now = new Date();
      const logEntry = {
        timestamp: now.toISOString(),
        time: now.toLocaleTimeString(),
        date: now.toLocaleDateString(),
        period: now.getHours() >= 12 ? 'PM' : 'AM',
        lrn: lrn,
        name: student.name,
        sex: student.sex,
        grade: student.grade,
        section: student.section,
        action: action,
        photo: capturedImage || 'no-photo',
        status: 'verified'
      };
      
      saveLogLocally(logEntry);
      
      showSuccess(`${student.name} ${action} successful!`);
      
      resetCamera();
      lrnInput.value = '';
      lrnInput.focus();
    }
    
    function resetCamera() {
      isProcessing = false;
      if (!isFreshStarting) {
        captureBtn.disabled = false;
        lrnInput.disabled = false;
      }
      actionBtn.disabled = true;
      previewArea.style.display = 'none';
      capturedImage = null;
      
      video.style.display = 'block';
      canvas.style.display = 'none';
    }
    
    function showSuccess(msg) {
      document.getElementById('successMessage').textContent = msg;
      successOverlay.style.display = 'flex';
      setTimeout(() => {
        successOverlay.style.display = 'none';
      }, 1500);
    }
    
    function showError(msg) {
      document.getElementById('errorMessage').textContent = msg;
      errorOverlay.style.display = 'flex';
      setTimeout(() => {
        errorOverlay.style.display = 'none';
      }, 1500);
    }
    
    lrnInput.addEventListener('input', function(e) {
      this.value = this.value.replace(/[^0-9]/g, '').slice(0, 12);
      
      if (this.value.length === 12 && !isProcessing && !isFreshStarting) {
        handleCapture();
      }
    });
    
    lrnInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleCapture();
      }
    });
    
    window.exportLogs = function() {
      const master = JSON.parse(localStorage.getItem('asls_master') || '[]');
      const dataStr = JSON.stringify(master, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      
      const a = document.createElement('a');
      a.href = url;
      a.download = `asls_export_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      
      URL.revokeObjectURL(url);
      showSuccess(`Exported ${master.length} logs`);
    };
    
    window.onload = function() {
      initCamera();
      updateStats();
      lrnInput.focus();
      
      setInterval(updateStats, 1000);
      checkLogCountAndTriggerFreshStart();
      setInterval(checkLogCountAndTriggerFreshStart, 30000);
    };
    
    window.onbeforeunload = function() {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
      }
    };
    
    window.handleCapture = handleCapture;
    window.applyLog = applyLog;
  </script>
</body>
</html>
