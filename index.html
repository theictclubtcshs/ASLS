<head>
  <meta charset="UTF-8">

  <style>
    /* COMPACT, FAST-LOADING CSS */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      height: 90vh;
      background: white;
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      display: flex;
      overflow: hidden;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .left-panel {
      flex: 1;
      color: white;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: background-color 0.3s ease;
    }

    .left-panel.login-bg {
      background: #186E00 !important; /* Green */
    }

    .left-panel.logout-bg {
      background: #c0392b !important; /* Darker Red for better contrast */
    }

    .left-panel h1 {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .left-panel .mode-message {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .left-panel p {
      font-size: 1.2rem;
      opacity: 0.9;
      margin-bottom: 30px;
    }

    .stats {
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
    }

    .stat-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 1.1rem;
    }

    .right-panel {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
    }

    .camera-container {
      flex: 1;
      background: #f0f0f0;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      margin-bottom: 20px;
    }

    #video, #canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #canvas {
      display: none;
    }

    .camera-status {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f39c12;
      animation: pulse 1.5s infinite;
    }

    .status-dot.ready {
      background: #27ae60;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .input-area {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 15px;
    }

    .lrn-input {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .lrn-input input {
      flex: 1;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1.2rem;
      letter-spacing: 2px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .lrn-input input:focus {
      outline: none;
      border-color: #186E00;
      box-shadow: 0 0 0 3px rgba(24,110,0,0.1);
    }

    .lrn-input input.error {
      border-color: #e74c3c;
    }

    .lrn-input button {
      padding: 15px 30px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .lrn-input button:hover:not(:disabled) {
      background: #2980b9;
      transform: translateY(-2px);
    }

    .lrn-input button:disabled {
      background: #bdc3c7;
      cursor: not-allowed;
    }

    .preview {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .preview img {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      object-fit: cover;
      border: 3px solid #186E00;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      flex: 1;
    }

    .action-btn {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
    }

    .action-btn.login {
      background: #27ae60;
      color: white;
    }

    .action-btn.logout {
      background: #e74c3c;
      color: white;
    }

    .action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .quick-stats {
      margin-top: 15px;
      display: flex;
      justify-content: space-between;
      color: #666;
      font-size: 0.9rem;
    }

    /* Mode indicator */
    .mode-indicator {
      margin-top: 15px;
      padding: 10px;
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.95rem;
      backdrop-filter: blur(5px);
    }

    .mode-badge {
      padding: 5px 15px;
      border-radius: 20px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .mode-badge.login {
      background: #27ae60;
      color: white;
    }

    .mode-badge.logout {
      background: #e74c3c;
      color: white;
    }

    /* Overlays - Minimal for speed */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .overlay-content {
      text-align: center;
      color: white;
      padding: 40px;
    }

    .overlay-content h2 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    .overlay-content .success {
      color: #27ae60;
    }

    .overlay-content .error {
      color: #e74c3c;
    }

    /* Auto Fresh Start notification */
    .auto-fs-notification {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #186E00;
      color: white;
      padding: 20px 40px;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: bold;
      z-index: 2000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      animation: slideDown 0.5s ease-out;
    }

    @keyframes slideDown {
      from { top: -100px; opacity: 0; }
      to { top: 20px; opacity: 1; }
    }

    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .left-panel {
        padding: 20px;
      }
      .left-panel h1 {
        font-size: 2rem;
      }
      .left-panel .mode-message {
        font-size: 1.5rem;
      }
    }
  </style>

      { lrn: '104393140022', name: 'ZABALA JANETH ROWEN ALSECO', sex: 'FEMALE', grade: '12', section: 'Da Vinci' },
    ];
    
    // Fast lookup using Map (O(1) constant time)
    const studentMap = new Map();
    STUDENTS_DATA.forEach(s => studentMap.set(s.lrn, s));
    
    // DOM Elements
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let currentStream = null;
    let capturedImage = null;
    let isProcessing = false;
    
    const lrnInput = document.getElementById('lrn');
    const captureBtn = document.getElementById('captureBtn');
    const previewArea = document.getElementById('previewArea');
    const previewImage = document.getElementById('previewImage');
    const actionBtn = document.getElementById('actionBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const modeBadge = document.getElementById('modeBadge');
    const modeMessage = document.getElementById('modeMessage');
    const leftPanel = document.getElementById('leftPanel');
    
    const successOverlay = document.getElementById('successOverlay');
    const errorOverlay = document.getElementById('errorOverlay');
    
    // Get action from URL
    const urlParams = new URLSearchParams(window.location.search);
    let action = urlParams.get('action') || 'Log in';
    
    // ============================================
    // AUTO FRESH START DETECTION
    // ============================================
    
    // Check log count and notify main window if needed
    function checkLogCountAndNotify() {
      try {
        const logs = JSON.parse(localStorage.getItem('asls_master') || '[]');
        const logCount = logs.length;
        
        console.log(`Current log count: ${logCount}/40`);
        
        // If 40 or more logs, notify main window
        if (logCount >= 40) {
          console.log('🎯 Reached 40 logs! Notifying main window...');
          
          // Try to find the main window (opener)
          if (window.opener && !window.opener.closed) {
            // Send message to main window
            window.opener.postMessage({ type: 'AUTO_FRESH_START' }, '*');
            
            // Show notification in this window
            showAutoFreshStartNotification();
            
            // Close this camera window after a short delay
            setTimeout(() => {
              window.close();
            }, 3000);
          }
        }
      } catch (e) {
        console.error('Error checking log count:', e);
      }
    }
    
    // Show notification in camera window
    function showAutoFreshStartNotification() {
      const notification = document.createElement('div');
      notification.className = 'auto-fs-notification';
      notification.innerHTML = '🔄 System reached 40 logs! Auto-saving... Closing camera.';
      document.body.appendChild(notification);
      
      setTimeout(() => {
        notification.style.animation = 'fadeOut 0.5s ease-out';
        setTimeout(() => {
          document.body.removeChild(notification);
        }, 500);
      }, 2500);
    }
    
    // Listen for messages from main window
    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'CLOSE_CAMERA') {
        console.log('Received close command from main window');
        
        // Show notification
        const notification = document.createElement('div');
        notification.className = 'auto-fs-notification';
        notification.innerHTML = '🔄 System performing Fresh Start... Closing camera.';
        document.body.appendChild(notification);
        
        // Close after a moment
        setTimeout(() => {
          window.close();
        }, 1500);
      }
    });
    
    // ============================================
    // UPDATE UI BASED ON ACTION
    // ============================================
    
    function updateActionUI() {
      actionBtn.textContent = action;
      modeBadge.textContent = action;
      
      // Update the big mode message
      if (action === 'Log in') {
        modeMessage.textContent = 'YOU ARE LOGGING IN';
      } else {
        modeMessage.textContent = 'YOU ARE LOGGING OUT';
      }
      
      // Remove any existing color classes first
      leftPanel.classList.remove('login-bg', 'logout-bg');
      
      if (action === 'Log in') {
        actionBtn.className = 'action-btn login';
        modeBadge.className = 'mode-badge login';
        leftPanel.classList.add('login-bg');
        leftPanel.style.backgroundColor = '#186E00'; // Fallback
      } else {
        actionBtn.className = 'action-btn logout';
        modeBadge.className = 'mode-badge logout';
        leftPanel.classList.add('logout-bg');
        leftPanel.style.backgroundColor = '#c0392b'; // Fallback
      }
    }
    
    // Initial UI update
    updateActionUI();
    
    // ========== FAST LOCAL STORAGE ==========
    
    // Get today's path
    function getTodayPath() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const period = now.getHours() >= 12 ? 'PM' : 'AM';
      return `${year}-${month}-${day}-${period}`;
    }
    
    // INSTANT save to localStorage
    function saveLogLocally(logEntry) {
      const start = performance.now();
      
      // Master log (all entries)
      let masterLog = JSON.parse(localStorage.getItem('asls_master') || '[]');
      masterLog.push(logEntry);
      if (masterLog.length > 10000) masterLog = masterLog.slice(-10000); // Keep last 10k
      localStorage.setItem('asls_master', JSON.stringify(masterLog));
      
      // Daily log
      const today = getTodayPath();
      let dailyLog = JSON.parse(localStorage.getItem(`asls_${today}`) || '[]');
      dailyLog.push(logEntry);
      localStorage.setItem(`asls_${today}`, JSON.stringify(dailyLog));
      
      // Update stats
      updateStats();
      
      // Check log count after saving
      checkLogCountAndNotify();
      
      const end = performance.now();
      console.log(`✅ Saved in ${(end - start).toFixed(2)}ms`);
      return true;
    }
    
    // Update stats
    function updateStats() {
      const master = JSON.parse(localStorage.getItem('asls_master') || '[]');
      const today = getTodayPath();
      const daily = JSON.parse(localStorage.getItem(`asls_${today}`) || '[]');
      
      document.getElementById('todayCount').textContent = daily.length;
      document.getElementById('cacheSize').textContent = master.length + ' logs';
    }
    
    // ========== FAST STUDENT LOOKUP ==========
    
    function findStudent(lrn) {
      return studentMap.get(lrn);
    }
    
    // ========== CAMERA FUNCTIONS ==========
    
    async function initCamera() {
      try {
        statusText.textContent = 'Requesting camera...';
        
        if (currentStream) {
          currentStream.getTracks().forEach(t => t.stop());
        }
        
        currentStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'user' },
          audio: false 
        });
        
        video.srcObject = currentStream;
        await video.play();
        
        statusDot.className = 'status-dot ready';
        statusText.textContent = 'Ready';
        captureBtn.disabled = false;
        
      } catch (error) {
        statusText.textContent = 'Camera error';
        captureBtn.disabled = true;
      }
    }
    
    function handleCapture() {
      if (isProcessing) return;
      
      const lrn = lrnInput.value.trim();
      if (!lrn || lrn.length !== 12 || !/^\d+$/.test(lrn)) {
        showError('Enter valid 12-digit LRN');
        lrnInput.classList.add('error');
        return;
      }
      
      const student = findStudent(lrn);
      if (!student) {
        showError('Student not found');
        lrnInput.classList.add('error');
        return;
      }
      
      lrnInput.classList.remove('error');
      captureImage();
    }
    
    function captureImage() {
      isProcessing = true;
      captureBtn.disabled = true;
      lrnInput.disabled = true;
      
      // Capture photo
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // Compress image quickly (reduce quality for speed)
      capturedImage = canvas.toDataURL('image/jpeg', 0.6);
      
      previewImage.src = capturedImage;
      previewArea.style.display = 'flex';
      actionBtn.disabled = false;
      
      // Auto-apply after 200ms
      setTimeout(() => {
        if (!isProcessing) return;
        applyLog();
      }, 200);
    }
    
    async function applyLog() {
      const lrn = lrnInput.value.trim();
      const student = findStudent(lrn);
      
      if (!student) {
        showError('Student not found');
        resetCamera();
        return;
      }
      
      // Create log entry (fast, no compression)
      const now = new Date();
      const logEntry = {
        timestamp: now.toISOString(),
        time: now.toLocaleTimeString(),
        date: now.toLocaleDateString(),
        period: now.getHours() >= 12 ? 'PM' : 'AM',
        lrn: lrn,
        name: student.name,
        sex: student.sex,
        grade: student.grade,
        section: student.section,
        action: action,
        photo: capturedImage || 'no-photo',
        status: 'verified'
      };
      
      // INSTANT save to localStorage
      saveLogLocally(logEntry);
      
      // Show success
      showSuccess(`${student.name} ${action} successful!`);
      
      // Reset for next student
      resetCamera();
      lrnInput.value = '';
      lrnInput.focus();
    }
    
    function resetCamera() {
      isProcessing = false;
      captureBtn.disabled = false;
      lrnInput.disabled = false;
      actionBtn.disabled = true;
      previewArea.style.display = 'none';
      capturedImage = null;
      
      // Show video again
      video.style.display = 'block';
      canvas.style.display = 'none';
    }
    
    function showSuccess(msg) {
      document.getElementById('successMessage').textContent = msg;
      successOverlay.style.display = 'flex';
      setTimeout(() => {
        successOverlay.style.display = 'none';
      }, 1500);
    }
    
    function showError(msg) {
      document.getElementById('errorMessage').textContent = msg;
      errorOverlay.style.display = 'flex';
      setTimeout(() => {
        errorOverlay.style.display = 'none';
      }, 1500);
    }
    
    // ========== BARCODE SCANNER OPTIMIZATION ==========
    
    lrnInput.addEventListener('input', function(e) {
      // Only allow numbers
      this.value = this.value.replace(/[^0-9]/g, '').slice(0, 12);
      
      if (this.value.length === 12 && !isProcessing) {
        handleCapture();
      }
    });
    
    lrnInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleCapture();
      }
    });
    
    // ========== EXPORT FUNCTION (for admin) ==========
    
    window.exportLogs = function() {
      const master = JSON.parse(localStorage.getItem('asls_master') || '[]');
      const dataStr = JSON.stringify(master, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      
      const a = document.createElement('a');
      a.href = url;
      a.download = `asls_export_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      
      URL.revokeObjectURL(url);
      showSuccess(`Exported ${master.length} logs`);
    };
    
    // ========== INIT ==========
    
    window.onload = function() {
      initCamera();
      updateStats();
      lrnInput.focus();
      
      // Update stats every second
      setInterval(updateStats, 1000);
      
      // Check log count on load
      checkLogCountAndNotify();
    };
    
    window.onbeforeunload = function() {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
      }
    };
    
    // Expose functions
    window.handleCapture = handleCapture;
    window.applyLog = applyLog;
  </script>
